<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Bingo</title>  <script src="https://telegram.org/js/telegram-web-app.js"></script>  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f2f4f7;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 5px 0 12px;
      font-size: 26px;
    }

    .info,
    .called-box,
    .board,
    .legend {
      background: white;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 15px;
    }

    .label {
      color: #6b7280;
    }

    .value {
      font-weight: bold;
    }

    .last-called {
      background: #111827;
      color: white;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      margin-bottom: 12px;
    }

    .last-called-title {
      font-size: 14px;
      opacity: .8;
    }

    .last-number {
      font-size: 38px;
      font-weight: bold;
      margin-top: 3px;
    }

    .called-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .called-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      justify-content: center;
    }

    .called-number {
      min-width: 38px;
      height: 34px;
      padding: 0 8px;
      border-radius: 9px;
      background: #e8f5e9;
      border: 2px solid #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .no-called {
      color: #777;
      text-align: center;
      padding: 10px;
      width: 100%;
    }

    .bingo-header,
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .bingo-header {
      margin-bottom: 6px;
    }

    .bingo-header div {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      padding: 6px 0;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 10px;
      border: 2px solid #d1d5db;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .cell.called {
      background: white;
      border-color: #22c55e;
    }

    .cell.marked {
      background: #22c55e;
      border-color: #16a34a;
      color: white;
    }

    .cell.free {
      background: #facc15;
      border-color: #eab308;
      color: #111827;
      cursor: default;
      font-size: 14px;
    }

    .bingo-button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .bingo-button:disabled {
      opacity: .6;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
      min-height: 22px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 13px;
    }

    .legend-box {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      margin-right: 8px;
      border: 2px solid #d1d5db;
    }

    .legend-called {
      border-color: #22c55e;
    }

    .legend-marked {
      background: #22c55e;
      border-color: #16a34a;
    }

    .legend-free {
      background: #facc15;
      border-color: #eab308;
    }

    .loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .debug {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      word-break: break-word;
    }
  </style></head><body><div class="container">  <h1>🎱 Telegram Bingo</h1>  <div id="loading" class="loading">
    Loading your bingo card...
  </div>  <div id="error" class="error" style="display:none;"></div>  <div id="game" style="display:none;"><div class="info">

  <div class="info-row">
    <span class="label">Player</span>
    <span class="value" id="playerName">-</span>
  </div>

  <div class="info-row">
    <span class="label">Host</span>
    <span class="value" id="hostName">-</span>
  </div>

  <div class="info-row">
    <span class="label">Players</span>
    <span class="value" id="playerCount">-</span>
  </div>

  <div class="info-row">
    <span class="label">Called</span>
    <span class="value" id="calledCount">0/75</span>
  </div>

</div>

<div class="last-called">

  <div class="last-called-title">
    Last Called Number
  </div>

  <div class="last-number" id="lastCalled">
    —
  </div>

</div>

<div class="called-box">

  <div class="called-title">
    🎱 All Called Numbers
  </div>

  <div id="calledNumbers" class="called-list">
    <div class="no-called">
      No numbers called yet
    </div>
  </div>

</div>

<div class="board">

  <div class="bingo-header">
    <div>B</div>
    <div>I</div>
    <div>N</div>
    <div>G</div>
    <div>O</div>
  </div>

  <div id="board" class="grid"></div>

  <button id="bingoButton" class="bingo-button">
    🎉 BINGO!
  </button>

  <div id="message" class="message"></div>

</div>

<div class="legend">

  <div class="legend-item">
    <div class="legend-box legend-called"></div>
    Called number
  </div>

  <div class="legend-item">
    <div class="legend-box legend-marked"></div>
    Your marked number
  </div>

  <div class="legend-item">
    <div class="legend-box legend-free"></div>
    FREE space
  </div>

</div>

  </div></div><script>

const tg = window.Telegram && window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if (tg) {
  tg.ready();
  tg.expand();
}

const API_BASE = window.location.origin;

let cardData = null;
let userId = null;
let chatId = null;

/*
====================================================
GET TELEGRAM USER
====================================================
*/

function getUserId() {

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user &&
    tg.initDataUnsafe.user.id
  ) {
    return String(tg.initDataUnsafe.user.id);
  }

  const params = new URLSearchParams(window.location.search);

  return (
    params.get("userId") ||
    params.get("userid") ||
    params.get("user_id") ||
    null
  );
}


/*
====================================================
GET GAME / CHAT ID
====================================================
*/

function getGameId() {

  const params =
    new URLSearchParams(window.location.search);

  /*
    Telegram Mini App start parameter
  */

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.start_param
  ) {

    const value =
      tg.initDataUnsafe.start_param;

    if (value) {
      return String(value);
    }
  }

  /*
    URL parameters
  */

  const possibleNames = [
    "chatId",
    "chat_id",
    "gameId",
    "game_id",
    "startapp",
    "start_param",
    "start"
  ];

  for (const name of possibleNames) {

    const value = params.get(name);

    if (value) {
      return String(value);
    }
  }

  /*
    Telegram sometimes places the parameter
    after ?startapp=
  */

  const currentUrl =
    window.location.href;

  const match =
    currentUrl.match(
      /(?:chatId|chat_id|gameId|game_id|startapp|start_param|start)=([^&]+)/i
    );

  if (match && match[1]) {
    return decodeURIComponent(match[1]);
  }

  return null;
}


userId = getUserId();
chatId = getGameId();


/*
====================================================
ERROR
====================================================
*/

function showError(message) {

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("game").style.display =
    "none";

  const box =
    document.getElementById("error");

  box.style.display = "block";

  box.innerHTML =
    message +
    '<div class="debug">' +
    "Telegram user: " +
    (userId ? "OK" : "missing") +
    "<br>" +
    "Game ID: " +
    (chatId ? "OK" : "missing") +
    "</div>";
}


/*
====================================================
MESSAGE
====================================================
*/

function showMessage(message) {

  const box =
    document.getElementById("message");

  box.textContent = message;

  setTimeout(function() {
    box.textContent = "";
  }, 3500);
}


/*
====================================================
CALLED NUMBERS
====================================================
*/

function renderCalledNumbers(numbers) {

  const container =
    document.getElementById("calledNumbers");

  container.innerHTML = "";

  if (!Array.isArray(numbers) || numbers.length === 0) {

    container.innerHTML =
      '<div class="no-called">No numbers called yet</div>';

    return;
  }

  numbers.forEach(function(number) {

    const item =
      document.createElement("div");

    item.className =
      "called-number";

    item.textContent =
      number;

    container.appendChild(item);

  });

  container.scrollTop =
    container.scrollHeight;
}


/*
====================================================
BOARD
====================================================
*/

function renderBoard() {

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  if (
    !cardData ||
    !Array.isArray(cardData.card)
  ) {
    return;
  }

  const calledNumbers =
    Array.isArray(cardData.calledNumbers)
      ? cardData.calledNumbers
      : [];

  const markedNumbers =
    Array.isArray(cardData.markedNumbers)
      ? cardData.markedNumbers
      : [];

  const card =
    cardData.card;

  for (let row = 0; row < 5; row++) {

    for (let col = 0; col < 5; col++) {

      const cell =
        document.createElement("div");

      cell.className = "cell";

      const value =
        card[row][col];

      if (row === 2 && col === 2) {

        cell.classList.add("free");
        cell.textContent = "FREE";

      } else {

        cell.textContent =
          value;

        if (
          calledNumbers.includes(value) ||
          calledNumbers.includes(Number(value))
        ) {
          cell.classList.add("called");
        }

        if (
          markedNumbers.includes(value) ||
          markedNumbers.includes(Number(value))
        ) {
          cell.classList.add("marked");
        }

        cell.addEventListener(
          "click",
          function() {

            if (
              !calledNumbers.includes(value) &&
              !calledNumbers.includes(Number(value))
            ) {

              showMessage(
                "⏳ This number has not been called yet."
              );

              return;
            }

            toggleMark(value);
          }
        );
      }

      board.appendChild(cell);
    }
  }
}


/*
====================================================
MARK / UNMARK
====================================================
*/

async function toggleMark(value) {

  if (!chatId || !userId) {
    showMessage("Game or player information is missing.");
    return;
  }

  const marked =
    Array.isArray(cardData.markedNumbers)
      ? cardData.markedNumbers
      : [];

  const isMarked =
    marked.includes(value) ||
    marked.includes(Number(value));

  const endpoint =
    isMarked
      ? "/api/unmark"
      : "/api/mark";

  try {

    const response =
      await fetch(
        API_BASE + endpoint,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chatId: chatId,
            userId: userId,
            number: value
          })
        }
      );

    const result =
      await response.json();

    if (!response.ok) {

      showMessage(
        result.error ||
        "Could not update mark."
      );

      return;
    }

    await loadCard();

  } catch (error) {

    showMessage(
      "Connection error. Please try again."
    );
  }
}


/*
====================================================
LOAD GAME
====================================================
*/

async function loadCard() {

  userId = getUserId();
  chatId = getGameId();

  if (!userId) {

    showError(
      "Telegram could not identify your player account."
    );

    return;
  }

  if (!chatId) {

    showError(
      "The Mini App did not receive the Bingo game ID. Open the Mini App from the Bingo game's /play button."
    );

    return;
  }

  try {

    const url =
      API_BASE +
      "/api/card?chatId=" +
      encodeURIComponent(chatId) +
      "&userId=" +
      encodeURIComponent(userId);

    const response =
      await fetch(url, {
        cache: "no-store"
      });

    const data =
      await response.json();

    if (!response.ok) {

      showError(
        data.error ||
        "Could not load your bingo card."
      );

      return;
    }

    cardData = data;

    document.getElementById("playerName").textContent =
      data.playerName || "Player";

    document.getElementById("hostName").textContent =
      data.hostName || "Host";

    document.getElementById("playerCount").textContent =
      data.playerCount ?? "0";

    const calledNumbers =
      Array.isArray(data.calledNumbers)
        ? data.calledNumbers
        : [];

    document.getElementById("calledCount").textContent =
      calledNumbers.length + "/75";

    document.getElementById("lastCalled").textContent =
      calledNumbers.length
        ? calledNumbers[calledNumbers.length - 1]
        : "—";

    renderCalledNumbers(calledNumbers);

    renderBoard();

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("error").style.display =
      "none";

    document.getElementById("game").style.display =
      "block";

  } catch (error) {

    showError(
      "Could not connect to the bingo server."
    );
  }
}


/*
====================================================
BINGO
====================================================
*/

document
  .getElementById("bingoButton")
  .addEventListener(
    "click",
    async function() {

      const button =
        document.getElementById("bingoButton");

      button.disabled = true;
      button.textContent = "Checking...";

      try {

        const response =
          await fetch(
            API_BASE + "/api/bingo",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                chatId: chatId,
                userId: userId
              })
            }
          );

        const result =
          await response.json();

        if (response.ok) {

          showMessage(
            "🎉 BINGO! " +
            (result.message || "You have Bingo!")
          );

          if (
            tg &&
            tg.HapticFeedback
          ) {
            tg.HapticFeedback
              .notificationOccurred("success");
          }

        } else {

          showMessage(
            "❌ " +
            (result.error || "Not Bingo yet.")
          );

        }

      } catch (error) {

        showMessage(
          "Connection error. Please try again."
        );

      }

      button.disabled = false;
      button.textContent = "🎉 BINGO!";
    }
  );


/*
====================================================
START
====================================================
*/

loadCard();


/*
====================================================
AUTO REFRESH
====================================================
*/

setInterval(
  loadCard,
  3000
);

</script></body>
</html>
