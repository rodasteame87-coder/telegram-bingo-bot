<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 15px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card-grid {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr);
      gap: 8px;
    }

    .card-button {
      border: none;
      background: white;
      border-radius: 10px;
      padding: 15px 5px;
      font-size: 18px;
      font-weight: bold;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.12);
    }

    .card-button.selected {
      background: #1687ff;
      color: white;
    }

    .preview {
      margin-top: 18px;
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.12);
    }

    .preview h2 {
      text-align: center;
      margin-top: 0;
    }

    .bingo-board {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr);
      gap: 5px;
    }

    .board-header {
      background: #1687ff;
      color: white;
      font-weight: bold;
      padding: 9px 2px;
      text-align: center;
      border-radius: 5px;
    }

    .cell {
      background: #f8f8f8;
      border: 1px solid #ddd;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .cell.free {
      background: #ffd54a;
    }

    .cell.marked {
      background: #20b26b;
      color: white;
    }

    .ok-button,
    .bingo-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #20a464;
      color: white;
    }

    .back-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      background: #ddd;
    }

    .game-info {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.12);
    }

    .current-number {
      font-size: 45px;
      font-weight: bold;
      margin: 8px 0;
      color: #1687ff;
    }

    .status {
      font-weight: bold;
      margin-top: 5px;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      justify-content: center;
    }

    .history-number {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1687ff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .game-card-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
      min-height: 22px;
    }

    .small {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 8px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- CARD SELECTION -->

  <div
    id="selectionScreen"
    class="screen active"
  >

    <h1>🎯 Choose Your Bingo Card</h1>

    <div
      id="cardGrid"
      class="card-grid"
    ></div>

    <div
      id="preview"
      class="preview"
      style="display:none;"
    >
      <h2 id="previewTitle">
        Card
      </h2>

      <div
        id="previewBoard"
        class="bingo-board"
      ></div>

      <button
        id="okButton"
        class="ok-button"
      >
        ✅ OK — Choose This Card
      </button>
    </div>

    <div
      id="selectionMessage"
      class="message"
    ></div>

  </div>


  <!-- GAME SCREEN -->

  <div
    id="gameScreen"
    class="screen"
  >

    <h1>🎯 BINGO</h1>

    <div class="game-info">

      <div>
        Game #<span id="gameId">-</span>
      </div>

      <div
        id="gameStatus"
        class="status"
      >
        Loading game...
      </div>

      <div class="small">
        Latest Number
      </div>

      <div
        id="currentNumber"
        class="current-number"
      >
        -
      </div>

      <div class="small">
        Called Numbers:
        <span id="calledCount">0</span>/75
      </div>

      <div
        id="history"
        class="history"
      ></div>

    </div>

    <div class="game-card-title">
      Your Card #<span id="gameCardNumber">-</span>
    </div>

    <div
      id="gameBoard"
      class="bingo-board"
    ></div>

    <button
      id="bingoButton"
      class="bingo-button"
    >
      🎉 BINGO!
    </button>

    <div
      id="gameMessage"
      class="message"
    ></div>

    <button
      id="backButton"
      class="back-button"
    >
      🔙 Change Card
    </button>

  </div>

</div>

<script>
  const tg =
    window.Telegram &&
    window.Telegram.WebApp
      ? window.Telegram.WebApp
      : null;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const initData =
    tg
      ? tg.initData
      : "";

  let cards = [];
  let selectedCardNumber = null;
  let selectedBoard = null;

  let gameBoard = null;
  let markedNumbers = [];

  let gamePolling = null;


  async function api(
    url,
    options = {}
  ) {
    const response =
      await fetch(
        url,
        options
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Request failed"
      );
    }

    return data;
  }


  async function loadCards() {
    try {

      const data =
        await api(
          "/api/cards"
        );

      cards = data;

      renderCardButtons();

      await loadMyCard();

    } catch (error) {

      document.getElementById(
        "selectionMessage"
      ).textContent =
        "❌ " +
        error.message;
    }
  }


  function renderCardButtons() {

    const grid =
      document.getElementById(
        "cardGrid"
      );

    grid.innerHTML = "";

    cards.forEach(card => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "card-button";

      button.textContent =
        card.card_number;

      button.onclick =
        () => previewCard(
          card.card_number
        );

      grid.appendChild(
        button
      );
    });
  }


  function previewCard(
    cardNumber
  ) {

    const card =
      cards.find(
        c =>
          c.card_number ===
          cardNumber
      );

    if (!card) {
      return;
    }

    selectedCardNumber =
      cardNumber;

    selectedBoard =
      card.board;

    document.getElementById(
      "preview"
    ).style.display =
      "block";

    document.getElementById(
      "previewTitle"
    ).textContent =
      "🎯 Card #" +
      cardNumber;

    renderBoard(
      selectedBoard,
      document.getElementById(
        "previewBoard"
      ),
      []
    );

    document.querySelectorAll(
      ".card-button"
    ).forEach(
      button => {
        button.classList.toggle(
          "selected",
          Number(
            button.textContent
          ) === cardNumber
        );
      }
    );

    document.getElementById(
      "selectionMessage"
    ).textContent =
      "Preview your card and press OK.";
  }


  document.getElementById(
    "okButton"
  ).onclick =
    async () => {

      if (
        !selectedCardNumber
      ) {
        document.getElementById(
          "selectionMessage"
        ).textContent =
          "Please choose a card first.";

        return;
      }

      try {

        const result =
          await api(
            "/api/select-card",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  initData:
                    initData,

                  cardNumber:
                    selectedCardNumber
                })
            }
          );

        selectedBoard =
          result.board;

        markedNumbers = [];

        openGameScreen();

      } catch (error) {

        document.getElementById(
          "selectionMessage"
        ).textContent =
          "❌ " +
          error.message;
      }
    };


  async function loadMyCard() {

    if (!initData) {
      return;
    }

    try {

      const data =
        await api(
          "/api/my-card?initData=" +
          encodeURIComponent(
            initData
          )
        );

      if (
        data.cardNumber &&
        data.board
      ) {

        selectedCardNumber =
          data.cardNumber;

        selectedBoard =
          data.board;

        markedNumbers =
          data.markedNumbers ||
          [];

        openGameScreen();
      }

    } catch (error) {

      console.log(
        "MY CARD:",
        error.message
      );
    }
  }


  function openGameScreen() {

    document.getElementById(
      "selectionScreen"
    ).classList.remove(
      "active"
    );

    document.getElementById(
      "gameScreen"
    ).classList.add(
      "active"
    );

    document.getElementById(
      "gameCardNumber"
    ).textContent =
      selectedCardNumber;

    renderGameBoard();

    loadGameState();

    if (!gamePolling) {
      gamePolling =
        setInterval(
          loadGameState,
          2000
        );
    }
  }


  function renderGameBoard() {

    renderBoard(
      selectedBoard,
      document.getElementById(
        "gameBoard"
      ),
      markedNumbers
    );
  }


  function renderBoard(
    board,
    element,
    marks
  ) {

    element.innerHTML = "";

    const headers =
      [
        "B",
        "I",
        "N",
        "G",
        "O"
      ];

    headers.forEach(
      letter => {

        const header =
          document.createElement(
            "div"
          );

        header.className =
          "board-header";

        header.textContent =
          letter;

        element.appendChild(
          header
        );
      }
    );

    for (
      let row = 0;
      row < 5;
      row++
    ) {

      for (
        let col = 0;
        col < 5;
        col++
      ) {

        const column =
          board[
            headers[col]
          ];

        const value =
          column[row];

        const cell =
          document.createElement(
            "div"
          );

        cell.className =
          "cell";

        cell.textContent =
          value;

        if (
          value === "FREE"
        ) {

          cell.classList.add(
            "free"
          );

        } else {

          const number =
            Number(value);

          if (
            marks.includes(
              number
            )
          ) {
            cell.classList.add(
              "marked"
            );
          }

          cell.onclick =
            () =>
              toggleNumber(
                number
              );
        }

        element.appendChild(
          cell
        );
      }
    }
  }


  let calledNumbers = [];


  async function loadGameState() {

    try {

      const game =
        await api(
          "/api/game-state"
        );

      calledNumbers =
        game.calledNumbers ||
        [];

      document.getElementById(
        "gameId"
      ).textContent =
        game.gameId || "-";

      document.getElementById(
        "calledCount"
      ).textContent =
        calledNumbers.length;

      document.getElementById(
        "currentNumber"
      ).textContent =
        game.currentNumber ||
        "-";

      if (
        game.status ===
        "playing"
      ) {

        document.getElementById(
          "gameStatus"
        ).textContent =
          "🟢 GAME IS LIVE";

      } else if (
        game.status ===
        "finished"
      ) {

        document.getElementById(
          "gameStatus"
        ).textContent =
          "🏁 GAME FINISHED";

      } else {

        document.getElementById(
          "gameStatus"
        ).textContent =
          "⏳ WAITING";
      }

      renderHistory(
        calledNumbers
      );

      renderGameBoard();

    } catch (error) {

      document.getElementById(
        "gameStatus"
      ).textContent =
        "❌ Connection error";
    }
  }


  function renderHistory(
    numbers
  ) {

    const history =
      document.getElementById(
        "history"
      );

    history.innerHTML = "";

    const recent =
      [...numbers]
        .reverse()
        .slice(0, 20);

    recent.forEach(
      number => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "history-number";

        item.textContent =
          number;

        history.appendChild(
          item
        );
      }
    );
  }


  async function toggleNumber(
    number
  ) {

    if (
      !calledNumbers.includes(
        number
      )
    ) {

      document.getElementById(
        "gameMessage"
      ).textContent =
        "⏳ Number " +
        number +
        " has not been called yet.";

      return;
    }

    try {

      if (
        markedNumbers.includes(
          number
        )
      ) {

        const result =
          await api(
            "/api/unmark",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  initData:
                    initData,

                  number:
                    number
                })
            }
          );

        markedNumbers =
          result.markedNumbers ||
          [];

      } else {

        const result =
          await api(
            "/api/mark",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  initData:
                    initData,

                  number:
                    number
                })
            }
          );

        markedNumbers =
          result.markedNumbers ||
          [];
      }

      renderGameBoard();

      document.getElementById(
        "gameMessage"
      ).textContent = "";

    } catch (error) {

      document.getElementById(
        "gameMessage"
      ).textContent =
        "❌ " +
        error.message;
    }
  }


  document.getElementById(
    "bingoButton"
  ).onclick =
    async () => {

      try {

        const result =
          await api(
            "/api/bingo",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  initData:
                    initData
                })
            }
          );

        document.getElementById(
          "gameMessage"
        ).textContent =
          result.message;

        if (
          result.bingo
        ) {

          document.getElementById(
            "gameMessage"
          ).style.fontSize =
            "22px";
        }

      } catch (error) {

        document.getElementById(
          "gameMessage"
        ).textContent =
          "❌ " +
          error.message;
      }
    };


  document.getElementById(
    "backButton"
  ).onclick =
    () => {

      if (gamePolling) {
        clearInterval(
          gamePolling
        );

        gamePolling = null;
      }

      document.getElementById(
        "gameScreen"
      ).classList.remove(
        "active"
      );

      document.getElementById(
        "selectionScreen"
      ).classList.add(
        "active"
      );
    };


  loadCards();
</script>

</body>
</html>
