<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 16px;
}

h1 {
  text-align: center;
  margin: 5px 0 8px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 18px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.game-info {
  background: #1f2937;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  text-align: center;
}

.game-number {
  font-size: 18px;
  font-weight: bold;
}

.game-status {
  margin-top: 5px;
  color: #9ca3af;
  font-size: 14px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.card-number {
  border: none;
  border-radius: 10px;
  padding: 14px 5px;
  font-size: 17px;
  font-weight: bold;

  color: white;
}

.card-number:active {
  transform: scale(.95);
}

.card-number.unavailable {
  background: #4b5563;

}

.legend {

  margin: 15px 0;
  color: #9ca3af;
  font-size: 13px;
}

.preview-box {
  background: #1f2937;
  border-radius: 14px;
  padding: 15px;
  margin-top: 15px;
}

.preview-title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.bingo-board {
  width: 100%;
  border-collapse: separate;
  border-spacing: 4px;
}

.bingo-board th {
  font-size: 18px;
  padding: 7px;
}

.bingo-board td {
  background: #374151;
  border-radius: 7px;
  text-align: center;
  padding: 12px 2px;
  font-size: 16px;
  font-weight: bold;
}

.free {
  background: #16a34a !important;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button.main-button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 17px;
  font-weight: bold;
}

.ok-button {
  background: #16a34a;
  color: white;
}

.back-button {
  background: #4b5563;
  color: white;
}

.called-box {
  background: #1f2937;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  margin-bottom: 14px;
}

.called-label {
  color: #9ca3af;
  font-size: 14px;
}

.current-number {
  font-size: 48px;
  font-weight: bold;
  margin: 5px 0;
}

.called-history {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  max-height: 100px;
  overflow-y: auto;
}

.called-history span {
  background: #2563eb;
  border-radius: 7px;
  padding: 5px 8px;
  font-size: 13px;
}

.my-card-title {
  text-align: center;
  margin: 12px 0;
  font-size: 20px;
  font-weight: bold;
}

.play-board td {
  cursor: pointer;
  user-select: none;
}

.play-board td.called {
  background: #2563eb;
}

.play-board td.marked {
  background: #16a34a;
}

.play-board td.free {
  background: #16a34a !important;
}

.bingo-button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  margin-top: 15px;
  background: #dc2626;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.result-box {
  border-radius: 14px;
  padding: 20px;
  margin-top: 15px;
  text-align: center;
}

.winner-box {
  background: #14532d;
}

.gameover-box {
  background: #7f1d1d;
}

.result-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 10px;
}

.result-text {
  font-size: 17px;
  line-height: 1.5;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #9ca3af;
}

.error {
  background: #7f1d1d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}

.success {
  background: #14532d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= SELECTION SCREEN ================= -->

<div id="selectionScreen" class="screen active">

<h1>🎱 BINGO</h1>

<div class="subtitle">
Choose your card
</div>

<div class="game-info">

<div class="game-number" id="selectionGame">
Game
</div>

<div class="game-status" id="selectionStatus">
Choose one card from 1–100
</div>

</div>

<div id="errorBox"></div>

<div id="cardsGrid" class="cards-grid">
<div class="loading">
Loading cards...
</div>
</div>

<div class="legend">
🔵 Available &nbsp;&nbsp; ⚫ Already taken
</div>

<div id="previewBox" class="preview-box" style="display:none;">

<div class="preview-title" id="previewTitle">
Card
</div>

<div id="previewBoard"></div>

<div class="button-row">

<button
class="main-button back-button"
id="backButton"
>
Back
</button>

<button
class="main-button ok-button"
id="confirmButton"
>
OK
</button>

</div>

</div>

</div>


<!-- ================= GAME SCREEN ================= -->

<div id="gameScreen" class="screen">

<h1>🎱 BINGO</h1>

<div class="game-info">

<div class="game-number" id="gameNumber">
Game
</div>

<div class="game-status" id="gameStatus">
Game is running
</div>

</div>

<div class="called-box">

<div class="called-label">
CURRENT NUMBER
</div>

<div class="current-number" id="currentNumber">
-
</div>

<div class="called-label">
Called numbers
</div>

<div class="called-history" id="calledHistory"></div>

</div>

<div class="my-card-title" id="myCardTitle">
My Card
</div>

<div id="gameBoard"></div>

<button id="bingoButton" class="bingo-button">
🏆 BINGO
</button>

<div id="resultArea"></div>

</div>

</div>


<script>

const tg =
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =====================================================
   VARIABLES
===================================================== */

let selectedCardNumber = null;
let selectedBoard = null;

let myCardNumber = null;
let myBoard = null;

let calledNumbers = [];
let markedNumbers = [];

let currentGameId = null;
let currentGameStatus = "waiting";

let appStarted = false;

let gamePolling = null;


/* =====================================================
   INIT DATA
===================================================== */

function getInitData() {

  if (!tg) {
    return "";
  }

  return tg.initData || "";

}


/* =====================================================
   API HELPER
===================================================== */

async function api(url, options = {}) {

  const requestOptions = {
    ...options,
    cache: "no-store",
    headers: {
      ...(options.headers || {}),
      "Content-Type": "application/json",
      "Cache-Control": "no-cache"
    }
  };

  const response =
    await fetch(url, requestOptions);

  let data;

  try {
    data = await response.json();
  } catch {
    throw new Error(
      "Invalid server response."
    );
  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      data.error ||
      `Server error ${response.status}`
    );

  }

  return data;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   ERRORS
===================================================== */

function showError(message) {

  document.getElementById(
    "errorBox"
  ).innerHTML = `
    <div class="error">
      ${escapeHtml(message)}
    </div>
  `;

}


function clearError() {

  document.getElementById(
    "errorBox"
  ).innerHTML = "";

}


/* =====================================================
   SCREEN
===================================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(
      screen => {
        screen.classList.remove("active");
      }
    );

  const screen =
    document.getElementById(id);

  if (screen) {
    screen.classList.add("active");
  }

}


/* =====================================================
   BOARD NORMALIZER
===================================================== */

function normalizeBoard(board) {

  if (!board) {
    return null;
  }

  if (typeof board === "string") {

    try {
      board = JSON.parse(board);
    } catch {
      return null;
    }

  }


  /* 5 x 5 array */

  if (Array.isArray(board)) {

    if (board.length !== 5) {
      return null;
    }

    for (
      let r = 0;
      r < 5;
      r++
    ) {

      if (
        !Array.isArray(board[r]) ||
        board[r].length !== 5
      ) {

        return null;

      }

    }

    return board;

  }


  /* B I N G O columns */

  if (
    typeof board === "object" &&
    board !== null
  ) {

    const B = board.B;
    const I = board.I;
    const N = board.N;
    const G = board.G;
    const O = board.O;

    if (
      !Array.isArray(B) ||
      !Array.isArray(I) ||
      !Array.isArray(N) ||
      !Array.isArray(G) ||
      !Array.isArray(O)
    ) {

      return null;

    }

    if (
      B.length !== 5 ||
      I.length !== 5 ||
      N.length !== 5 ||
      G.length !== 5 ||
      O.length !== 5
    ) {

      return null;

    }

    return [

      [B[0], I[0], N[0], G[0], O[0]],
      [B[1], I[1], N[1], G[1], O[1]],
      [B[2], I[2], N[2], G[2], O[2]],
      [B[3], I[3], N[3], G[3], O[3]],
      [B[4], I[4], N[4], G[4], O[4]]

    ];

  }

  return null;

}


/* =====================================================
   LOAD CARD NUMBERS
===================================================== */

async function loadCards() {

  const grid =
    document.getElementById(
      "cardsGrid"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading cards...
    </div>
  `;

  try {

    const data =
      await api(
        `/api/cards?_=${Date.now()}`
      );

    currentGameId =
      Number(data.gameId || 0);

    document.getElementById(
      "selectionGame"
    ).textContent =
      `Game ${currentGameId}`;


    const usedCards =
      Array.isArray(data.usedCards)
      ? data.usedCards.map(Number)
      : [];

    const usedBy =
      data.usedBy || {};

    grid.innerHTML = "";

    for (
      let number = 1;
      number <= 100;
      number++
    ) {

      const button =
        document.createElement("button");

      button.className =
        "card-number";

      button.textContent =
        number;

      if (
        usedCards.includes(number)
      ) {

        button.classList.add(
          "unavailable"
        );

        button.disabled = true;

        const owner =
          usedBy[String(number)];

        if (
          owner &&
          owner.name
        ) {

          button.title =
            `Taken by ${owner.name}`;

        }

      } else {

        button.addEventListener(
          "click",
          () => previewCard(number)
        );

      }

      grid.appendChild(button);

    }

  } catch (error) {

    console.error(
      "LOAD CARDS ERROR:",
      error
    );

    grid.innerHTML = "";

    showError(
      error.message ||
      "Could not load cards."
    );

    /*
     * Still display the numbers so the
     * user can retry.
     */

    for (
      let number = 1;
      number <= 100;
      number++
    ) {

      const button =
        document.createElement("button");

      button.className =
        "card-number";

      button.textContent =
        number;

      button.addEventListener(
        "click",
        () => previewCard(number)
      );

      grid.appendChild(button);

    }

  }

}


/* =====================================================
   DIRECT CARD
===================================================== */

async function getCard(number) {

  const data =
    await api(
      `/api/card?number=${encodeURIComponent(number)}&_=${Date.now()}`
    );

  console.log(
    "CARD RESPONSE:",
    data
  );

  if (
    data.success !== true
  ) {

    throw new Error(
      data.message ||
      "Card could not be loaded."
    );

  }

  const board =
    normalizeBoard(data.board) ||
    normalizeBoard(data.card);

  if (!board) {

    throw new Error(
      `Card #${number} has an invalid Bingo board.`
    );

  }

  return {
    ...data,
    board
  };

}


/* =====================================================
   PREVIEW
===================================================== */

async function previewCard(number) {

  clearError();

  selectedCardNumber = null;
  selectedBoard = null;

  const previewBox =
    document.getElementById(
      "previewBox"
    );

  previewBox.style.display =
    "block";

  document.getElementById(
    "previewTitle"
  ).textContent =
    `Loading Card #${number}...`;

  document.getElementById(
    "previewBoard"
  ).innerHTML = `
    <div class="loading">
      Loading Bingo board...
    </div>
  `;

  try {

    const data =
      await getCard(number);

    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );

    if (
      data.available === false
    ) {

      const owner =
        data.takenBy &&
        data.takenBy.name;

      throw new Error(
        owner
        ? `Card #${number} is already taken by ${owner}.`
        : `Card #${number} is already taken.`
      );

    }

    selectedCardNumber =
      Number(
        data.cardNumber || number
      );

    selectedBoard =
      data.board;

    document.getElementById(
      "previewTitle"
    ).textContent =
      `Card #${selectedCardNumber}`;

    document.getElementById(
      "previewBoard"
    ).innerHTML =
      createBoardHtml(
        selectedBoard,
        false
      );

    previewBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (error) {

    console.error(
      "PREVIEW ERROR:",
      error
    );

    previewBox.style.display =
      "none";

    showError(
      error.message ||
      "Could not load Bingo card."
    );

  }

}


/* =====================================================
   CANCEL
===================================================== */

function cancelSelection() {

  selectedCardNumber = null;
  selectedBoard = null;

  document.getElementById(
    "previewBox"
  ).style.display =
    "none";

  clearError();

}


/* =====================================================
   CONFIRM CARD
===================================================== */

async function confirmCard() {

  if (!selectedCardNumber) {

    showError(
      "Please choose a card first."
    );

    return;

  }

  const number =
    Number(selectedCardNumber);

  const button =
    document.getElementById(
      "confirmButton"
    );

  button.disabled = true;
  button.textContent =
    "Selecting...";

  clearError();

  try {

    console.log(
      "SELECTING CARD:",
      number
    );

    const data =
      await api(
        "/api/select-card",
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData(),

            cardNumber:
              number

          })

        }
      );

    console.log(
      "SELECT RESPONSE:",
      data
    );


    if (
      data.success !== true
    ) {

      throw new Error(
        data.message ||
        data.error ||
        "Could not select this card."
      );

    }


    /*
     * Get board from server response.
     * If server does not include it,
     * use the preview board.
     */

    const board =
      normalizeBoard(data.board) ||
      normalizeBoard(data.card) ||
      normalizeBoard(selectedBoard);

    if (!board) {

      throw new Error(
        "Card was selected but the Bingo board could not be displayed."
      );

    }


    /*
     * SAVE PLAYER STATE
     */

    myCardNumber =
      Number(
        data.cardNumber ||
        number
      );

    myBoard =
      board;

    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );

    markedNumbers = [];

    calledNumbers = [];


    selectedCardNumber = null;
    selectedBoard = null;


    /*
     * CLEAR PREVIEW
     */

    document.getElementById(
      "previewBox"
    ).style.display =
      "none";


    /*
     * PREPARE GAME SCREEN
     */

    document.getElementById(
      "resultArea"
    ).innerHTML = "";

    document.getElementById(
      "bingoButton"
    ).style.display =
      "block";

    document.getElementById(
      "bingoButton"
    ).disabled =
      false;

    document.getElementById(
      "bingoButton"
    ).textContent =
      "🏆 BINGO";


    document.getElementById(
      "gameNumber"
    ).textContent =
      `Game ${currentGameId}`;

    document.getElementById(
      "gameStatus"
    ).textContent =
      "Game is running";


    /*
     * IMPORTANT:
     *
     * SHOW GAME IMMEDIATELY.
     *
     * We do NOT wait for the game
     * state request here.
     */

    showScreen(
      "gameScreen"
    );

    renderMyBoard();


    /*
     * Now update numbers in background.
     *
     * This cannot block the OK button.
     */

    updateGameState().catch(
      error => {
        console.log(
          "BACKGROUND GAME UPDATE:",
          error
        );
      }
    );

  } catch (error) {

    console.error(
      "CONFIRM CARD ERROR:",
      error
    );

    showError(
      error.message ||
      "Could not select Bingo card."
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "OK";

  }

}


/* =====================================================
   LOAD MY CARD
===================================================== */

async function loadMyCard() {

  try {

    const data =
      await api(
        `/api/my-card?initData=${encodeURIComponent(getInitData())}&_=${Date.now()}`
      );

    console.log(
      "MY CARD:",
      data
    );

    if (
      !data ||
      !data.cardNumber
    ) {

      myCardNumber = null;
      myBoard = null;
      markedNumbers = [];

      showScreen(
        "selectionScreen"
      );

      await loadCards();

      return;

    }


    const board =
      normalizeBoard(data.board) ||
      normalizeBoard(data.card);

    if (!board) {

      myCardNumber = null;
      myBoard = null;
      markedNumbers = [];

      showScreen(
        "selectionScreen"
      );

      await loadCards();

      return;

    }


    myCardNumber =
      Number(data.cardNumber);

    myBoard =
      board;

    markedNumbers =
      Array.isArray(data.markedNumbers)
      ? data.markedNumbers.map(Number)
      : [];

    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );


    showScreen(
      "gameScreen"
    );

    renderMyBoard();

  } catch (error) {

    console.log(
      "NO EXISTING CARD:",
      error
    );

    myCardNumber = null;
    myBoard = null;
    markedNumbers = [];

    showScreen(
      "selectionScreen"
    );

    await loadCards();

  }

}


/* =====================================================
   BOARD HTML
===================================================== */

function createBoardHtml(
  board,
  playable
) {

  board =
    normalizeBoard(board);

  if (!board) {

    return `
      <div class="error">
        Could not display Bingo board.
      </div>
    `;

  }

  let html = `
    <table class="bingo-board ${
      playable
      ? "play-board"
      : ""
    }">

    <thead>
      <tr>
        <th>B</th>
        <th>I</th>
        <th>N</th>
        <th>G</th>
        <th>O</th>
      </tr>
    </thead>

    <tbody>
  `;


  for (
    let row = 0;
    row < 5;
    row++
  ) {

    html += "<tr>";


    for (
      let col = 0;
      col < 5;
      col++
    ) {

      const value =
        board[row][col];

      const free =
        row === 2 &&
        col === 2;

      const numeric =
        Number(value);

      let classes = "";


      if (free) {

        classes += " free";

      }


      if (
        playable &&
        !free &&
        Number.isFinite(numeric) &&
        markedNumbers.includes(numeric)
      ) {

        classes += " marked";

      } else if (
        playable &&
        !free &&
        Number.isFinite(numeric) &&
        calledNumbers.includes(numeric)
      ) {

        classes += " called";

      }


      let click = "";


      if (
        playable &&
        !free &&
        Number.isFinite(numeric)
      ) {

        click =
          `onclick="toggleMark(${numeric})"`;

      }


      html += `
        <td
          class="${classes.trim()}"
          ${click}
        >
          ${
            free
            ? "FREE"
            : escapeHtml(value)
          }
        </td>
      `;

    }


    html += "</tr>";

  }


  html += `
    </tbody>
    </table>
  `;

  return html;

}


/* =====================================================
   RENDER BOARD
===================================================== */

function renderMyBoard() {

  if (!myBoard) {
    return;
  }

  document.getElementById(
    "myCardTitle"
  ).textContent =
    `My Card #${myCardNumber}`;

  document.getElementById(
    "gameBoard"
  ).innerHTML =
    createBoardHtml(
      myBoard,
      true
    );

}


/* =====================================================
   MARK / UNMARK
===================================================== */

async function toggleMark(number) {

  number =
    Number(number);

  if (
    currentGameStatus !== "playing"
  ) {

    return;

  }

  if (
    !calledNumbers.includes(number)
  ) {

    return;

  }


  const already =
    markedNumbers.includes(number);


  try {

    const endpoint =
      already
      ? "/api/unmark"
      : "/api/mark";


    const data =
      await api(
        endpoint,
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData(),

            number

          })

        }
      );


    if (
      Array.isArray(
        data.markedNumbers
      )
    ) {

      markedNumbers =
        data.markedNumbers.map(Number);

    }


    renderMyBoard();

  } catch (error) {

    showError(
      error.message ||
      "Could not mark number."
    );

  }

}


/* =====================================================
   BINGO
===================================================== */

async function claimBingo() {

  if (!myCardNumber) {

    showError(
      "You have not selected a card."
    );

    return;

  }


  if (
    currentGameStatus !== "playing"
  ) {

    return;

  }


  const button =
    document.getElementById(
      "bingoButton"
    );

  button.disabled = true;

  button.textContent =
    "Checking...";

  clearError();


  try {

    const data =
      await api(
        "/api/bingo",
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData()

          })

        }
      );


    if (
      data.bingo === true
    ) {

      showWinner(
        data.winnerName ||
        "You",

        data.winnerCardNumber ||
        myCardNumber
      );

      return;

    }


    showError(
      data.message ||
      "Bingo is not valid yet."
    );


    button.disabled =
      false;

    button.textContent =
      "🏆 BINGO";

  } catch (error) {

    showError(
      error.message ||
      "Could not check Bingo."
    );

    button.disabled =
      false;

    button.textContent =
      "🏆 BINGO";

  }

}


/* =====================================================
   WINNER
===================================================== */

function showWinner(
  name,
  cardNumber
) {

  currentGameStatus =
    "finished";

  document.getElementById(
    "gameStatus"
  ).textContent =
    "Game finished";


  document.getElementById(
    "resultArea"
  ).innerHTML = `

    <div class="result-box winner-box">

      <div class="result-title">
        🏆 BINGO!
      </div>

      <div class="result-text">

        Winner:
        <strong>
          ${escapeHtml(name)}
        </strong>

        <br>

        Winning Card:
        <strong>
          #${escapeHtml(cardNumber)}
        </strong>

        <br><br>

        🎉 Congratulations!

      </div>

    </div>

  `;


  document.getElementById(
    "bingoButton"
  ).style.display =
    "none";

}

===================================================== */

/* =====================================================
   RESET FOR NEW GAME
===================================================== */

async function resetForNewGame(
  gameId
) {

  currentGameId =
    Number(gameId);

  currentGameStatus =
    "playing";

  selectedCardNumber = null;
  selectedBoard = null;

  myCardNumber = null;
  myBoard = null;

  calledNumbers = [];
  markedNumbers = [];


  document.getElementById(
    "currentNumber"
  ).textContent =
    "-";

  document.getElementById(
    "calledHistory"
  ).innerHTML =
    "";

  document.getElementById(
    "gameBoard"
  ).innerHTML =
    "";

  document.getElementById(
    "resultArea"
  ).innerHTML =
    "";

  document.getElementById(
    "bingoButton"
  ).style.display =
    "block";

  document.getElementById(
    "bingoButton"
  ).disabled =
    false;

  document.getElementById(
    "bingoButton"
  ).textContent =
    "🏆 BINGO";


  showScreen(
    "selectionScreen"
  );


  await loadCards();

}


/* =====================================================
   GAME STATE
===================================================== */

async function getGameState() {

  /*
   * Your current server uses /api/game.
   *
   * We try that first.
   */

  try {

    return await api(
      `/api/game?_=${Date.now()}`
    );

  } catch (firstError) {

    console.log(
      "/api/game failed, trying /api/game-state",
      firstError
    );

    /*
     * Compatibility with an older server.
     */

    return await api(
      `/api/game-state?_=${Date.now()}`
    );

  }

}


/* =====================================================
   UPDATE GAME STATE
===================================================== */

async function updateGameState() {

  try {

    const data =
      await getGameState();


    const newGameId =
      Number(
        data.gameId || 0
      );


    /*
     * Detect new game.
     */

    if (
      currentGameId !== null &&
      newGameId !== Number(currentGameId)
    ) {

      await resetForNewGame(
        newGameId
      );

      return;

    }


    if (
      currentGameId === null
    ) {

      currentGameId =
        newGameId;

    }


    currentGameStatus =
      data.status ||
      "waiting";


    calledNumbers =
      Array.isArray(
        data.calledNumbers
      )
      ? data.calledNumbers.map(Number)
      : [];


    document.getElementById(
      "gameNumber"
    ).textContent =
      `Game ${newGameId}`;


    document.getElementById(
      "selectionGame"
    ).textContent =
      `Game ${newGameId}`;


    document.getElementById(
      "currentNumber"
    ).textContent =
      data.currentNumber
      ? Number(data.currentNumber)
      : "-";


    renderCalledHistory();


    /*
     * GAME PLAYING
     */

    if (
      data.status === "playing"
    ) {

      document.getElementById(
        "gameStatus"
      ).textContent =
        "Game is running";


      if (
        myCardNumber &&
        myBoard
      ) {

        /*
         * Don't interrupt the game
         * screen if player already has card.
         */

        showScreen(
          "gameScreen"
        );

        renderMyBoard();

      }


      return;

    }


    /*
     * GAME FINISHED
     */

    if (
      data.status === "finished"
    ) {

      const winnerName =
        data.winnerName ||
        "Another player";

      const winnerCard =
        data.winnerCardNumber ||
        "?";


      if (
        myCardNumber &&
        Number(myCardNumber) ===
        Number(winnerCard)
      ) {

        showWinner(
          winnerName,
          winnerCard
        );

      } else if (
        myCardNumber
      ) {

        showGameOver(
          winnerName,
          winnerCard
        );

      }

    }

  } catch (error) {

    /*
     * Do not freeze the app if
     * game-state temporarily fails.
     */

    console.log(
      "GAME STATE ERROR:",
      error
    );

  }

}


/* =====================================================
   CALLED HISTORY
===================================================== */

function renderCalledHistory() {

  const history =
    document.getElementById(
      "calledHistory"
    );

  history.innerHTML =
    "";


  [
    ...calledNumbers
  ]
  .reverse()
  .forEach(
    number => {

      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        number;

      history.appendChild(
        span
      );

    }
  );

}


/* =====================================================
   POLLING
===================================================== */

async function poll() {

  /*
   * Never let polling block
   * the interface.
   */

  try {

    await updateGameState();

  } catch (error) {

    console.log(
      "POLL ERROR:",
      error
    );

  }

}


/* =====================================================
   START
===================================================== */

async function start() {

  if (appStarted) {
    return;
  }

  appStarted = true;


  /*
   * Get initial game state.
   */

  try {

    const state =
      await getGameState();

    currentGameId =
      Number(
        state.gameId || 0
      );

    currentGameStatus =
      state.status ||
      "waiting";

  } catch (error) {

    console.log(
      "INITIAL GAME STATE ERROR:",
      error
    );

  }


  /*
   * Check if this user already
   * has a card in the current game.
   */

  await loadMyCard();


  /*
   * Update numbers.
   */

  await updateGameState();


  /*
   * Poll every second.
   */

  if (!gamePolling) {

    gamePolling =
      setInterval(
        poll,
        1000
      );

  }

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
  "backButton"
).addEventListener(
  "click",
  cancelSelection
);


document.getElementById(
  "confirmButton"
).addEventListener(
  "click",
  confirmCard
);


document.getElementById(
  "bingoButton"
).addEventListener(
  "click",
  claimBingo
);


/* =====================================================
   START APP
===================================================== */

start();

</script>
