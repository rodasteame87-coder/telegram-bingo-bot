<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Telegram Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 6px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #aeb5c2;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0 10px;
    }

    /* CARD NUMBERS */

    .numbers {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .number {
      border: none;
      border-radius: 9px;
      background: #242936;
      color: white;
      font-size: 15px;
      font-weight: bold;
      min-height: 42px;
      cursor: pointer;
    }

    .number:active {
      transform: scale(0.96);
    }

    .number.selected {
      background: #168cff;
      box-shadow: 0 0 0 2px white inset;
    }

    /* PREVIEW */

    .preview-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 15px;
      background: #191d27;
      display: none;
    }

    .preview-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .bingo-card {
      width: 100%;
      max-width: 390px;
      margin: auto;
      border-collapse: separate;
      border-spacing: 4px;
    }

    .bingo-card th {
      background: #168cff;
      border-radius: 7px;
      height: 38px;
      font-size: 18px;
    }

    .bingo-card td {
      width: 20%;
      height: 55px;
      text-align: center;
      background: #292e39;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
    }

    .free {
      background: #35a853 !important;
      font-size: 13px !important;
    }

    .hint {
      text-align: center;
      color: #aeb5c2;
      font-size: 13px;
      margin: 12px 0;
    }

    /* OK BUTTON */

    #okButton {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #35a853;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #okButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      min-height: 20px;
      color: #aeb5c2;
      font-size: 14px;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #4ade80;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #aeb5c2;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎱 Telegram Bingo</h1>

  <div class="subtitle">
    Choose your permanent Bingo card
  </div>

  <div class="section-title">
    Choose Card 1–100
  </div>

  <div id="numbers" class="numbers">
    <div class="loading">Loading cards...</div>
  </div>

  <div id="previewBox" class="preview-box">

    <div id="previewTitle" class="preview-title">
      Card
    </div>

    <table class="bingo-card">
      <thead>
        <tr>
          <th>B</th>
          <th>I</th>
          <th>N</th>
          <th>G</th>
          <th>O</th>
        </tr>
      </thead>

      <tbody id="cardBody"></tbody>
    </table>

    <div class="hint">
      Check your card and press OK to confirm it.
    </div>

    <button id="okButton" disabled>
      ✅ OK — Choose This Card
    </button>

  </div>

  <div id="status" class="status"></div>

</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let cards = [];
  let selectedCardNumber = null;
  let selectedCard = null;

  const numbersContainer =
    document.getElementById("numbers");

  const previewBox =
    document.getElementById("previewBox");

  const previewTitle =
    document.getElementById("previewTitle");

  const cardBody =
    document.getElementById("cardBody");

  const okButton =
    document.getElementById("okButton");

  const status =
    document.getElementById("status");

  /* ==========================================
     TELEGRAM AUTHENTICATION
  ========================================== */

  const initData = tg.initData;

  if (!initData) {
    showError(
      "Please open this game from Telegram."
    );
  }

  /* ==========================================
     API
  ========================================== */

  async function apiRequest(url, options = {}) {

    const headers = {
      "Content-Type": "application/json",
      "Authorization": `tma ${initData}`,
      ...(options.headers || {})
    };

    const response = await fetch(url, {
      ...options,
      headers
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Request failed"
      );
    }

    return data;
  }

  /* ==========================================
     LOAD 100 PERMANENT CARDS
  ========================================== */

  async function loadCards() {

    try {

      const data =
        await apiRequest("/api/cards");

      cards = data.cards || [];

      renderNumbers();

      // Load player's previously selected card
      await loadMyCard();

    } catch (error) {

      console.error(error);

      showError(
        "Could not load Bingo cards."
      );
    }
  }

  /* ==========================================
     NUMBER BUTTONS
  ========================================== */

  function renderNumbers() {

    numbersContainer.innerHTML = "";

    for (let i = 1; i <= 100; i++) {

      const button =
        document.createElement("button");

      button.className = "number";
      button.textContent = i;

      button.addEventListener(
        "click",
        () => selectCard(i)
      );

      numbersContainer.appendChild(button);
    }
  }

  /* ==========================================
     SELECT CARD
  ========================================== */

  function selectCard(cardNumber) {

    const found =
      cards.find(
        card => Number(card.card_number) === cardNumber
      );

    if (!found) {
      showError("Card not found.");
      return;
    }

    selectedCardNumber = cardNumber;
    selectedCard = found.card;

    document
      .querySelectorAll(".number")
      .forEach(button => {
        button.classList.toggle(
          "selected",
          Number(button.textContent) === cardNumber
        );
      });

    showPreview(
      cardNumber,
      found.card
    );

    clearStatus();
  }

  /* ==========================================
     SHOW CARD PREVIEW
  ========================================== */

  function showPreview(
    cardNumber,
    card
  ) {

    previewBox.style.display = "block";

    previewTitle.textContent =
      `🎯 Bingo Card #${cardNumber}`;

    cardBody.innerHTML = "";

    for (let row = 0; row < 5; row++) {

      const tr =
        document.createElement("tr");

      for (let col = 0; col < 5; col++) {

        const td =
          document.createElement("td");

        const value =
          card[row][col];

        td.textContent = value;

        if (value === "FREE") {
          td.classList.add("free");
        }

        tr.appendChild(td);
      }

      cardBody.appendChild(tr);
    }

    okButton.disabled = false;

    previewBox.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }

  /* ==========================================
     CONFIRM CARD
  ========================================== */

  okButton.addEventListener(
    "click",
    async () => {

      if (!selectedCardNumber) {
        return;
      }

      okButton.disabled = true;
      okButton.textContent =
        "⏳ Saving...";

      clearStatus();

      try {

        const result =
          await apiRequest(
            "/api/select-card",
            {
              method: "POST",
              body: JSON.stringify({
                initData,
                cardNumber: selectedCardNumber
              })
            }
          );

        if (result.success) {

          showSuccess(
            `✅ Card #${selectedCardNumber} selected successfully!`
          );

          okButton.textContent =
            "✅ Card Selected";

          /*
             The actual Bingo game screen
             will be connected here next.
          */

        }

      } catch (error) {

        console.error(error);

        showError(
          error.message ||
          "Could not save your card."
        );

        okButton.disabled = false;

        okButton.textContent =
          "✅ OK — Choose This Card";
      }
    }
  );

  /* ==========================================
     LOAD PLAYER'S CURRENT CARD
  ========================================== */

  async function loadMyCard() {

    try {

      const data =
        await apiRequest(
          "/api/my-card?initData=" +
          encodeURIComponent(initData)
        );

      if (
        data.cardNumber &&
        data.card
      ) {

        selectCard(
          Number(data.cardNumber)
        );

        okButton.textContent =
          "✅ Card Already Selected";

        okButton.disabled = false;
      }

    } catch (error) {

      // New players won't have a card yet.
      console.log(
        "No previously selected card."
      );
    }
  }

  /* ==========================================
     STATUS
  ========================================== */

  function showError(message) {

    status.textContent = message;
    status.className =
      "status error";
  }

  function showSuccess(message) {

    status.textContent = message;
    status.className =
      "status success";
  }

  function clearStatus() {

    status.textContent = "";
    status.className =
      "status";
  }

  /* ==========================================
     START
  ========================================== */

  loadCards();

</script>

</body>
</html>
