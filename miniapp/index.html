<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 18px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* CARD SELECTION */

    .game-info {
      background: #1f2937;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: center;
    }

    .game-number {
      font-size: 18px;
      font-weight: bold;
    }

    .game-status {
      margin-top: 5px;
      color: #9ca3af;
      font-size: 14px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .card-number {
      border: none;
      border-radius: 10px;
      padding: 14px 5px;
      font-size: 17px;
      font-weight: bold;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .card-number:active {
      transform: scale(0.95);
    }

    .card-number.unavailable {
      background: #4b5563;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .card-number.selected {
      background: #16a34a;
    }

    .legend {
      text-align: center;
      margin: 15px 0;
      color: #9ca3af;
      font-size: 13px;
    }

    /* PREVIEW */

    .preview-box {
      background: #1f2937;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
    }

    .preview-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .bingo-board {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }

    .bingo-board th {
      font-size: 18px;
      padding: 7px;
      text-align: center;
    }

    .bingo-board td {
      background: #374151;
      border-radius: 7px;
      text-align: center;
      padding: 12px 2px;
      font-size: 16px;
      font-weight: bold;
    }

    .free {
      background: #16a34a !important;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.main-button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .ok-button {
      background: #16a34a;
      color: white;
    }

    .back-button {
      background: #4b5563;
      color: white;
    }

    /* GAME */

    .called-box {
      background: #1f2937;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      margin-bottom: 14px;
    }

    .called-label {
      color: #9ca3af;
      font-size: 14px;
    }

    .current-number {
      font-size: 48px;
      font-weight: bold;
      margin: 5px 0;
    }

    .called-history {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-height: 100px;
      overflow-y: auto;
    }

    .called-history span {
      background: #2563eb;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 13px;
    }

    .my-card-title {
      text-align: center;
      margin: 12px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .play-board td {
      cursor: pointer;
      user-select: none;
    }

    .play-board td.called {
      background: #2563eb;
    }

    .play-board td.marked {
      background: #16a34a;
    }

    .play-board td.free {
      background: #16a34a !important;
    }

    .bingo-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      margin-top: 15px;
      background: #dc2626;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    /* RESULT */

    .result-box {
      border-radius: 14px;
      padding: 20px;
      margin-top: 15px;
      text-align: center;
    }

    .winner-box {
      background: #14532d;
    }

    .gameover-box {
      background: #7f1d1d;
    }

    .result-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 17px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
    }

    .error {
      background: #7f1d1d;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- SELECTION SCREEN -->
  <div id="selectionScreen" class="screen active">

    <h1>🎱 BINGO</h1>

    <div class="subtitle">
      Choose your card
    </div>

    <div class="game-info">
      <div class="game-number" id="selectionGame">
        Game
      </div>

      <div class="game-status" id="selectionStatus">
        Choose one card from 1–100
      </div>
    </div>

    <div id="errorBox"></div>

    <div id="cardsGrid" class="cards-grid">
      <div class="loading">Loading cards...</div>
    </div>

    <div class="legend">
      🔵 Available &nbsp;&nbsp; ⚫ Already taken
    </div>

    <div id="previewBox" class="preview-box" style="display:none;">

      <div class="preview-title" id="previewTitle">
        Card
      </div>

      <div id="previewBoard"></div>

      <div class="button-row">

        <button
          class="main-button back-button"
          onclick="cancelSelection()"
        >
          Back
        </button>

        <button
          class="main-button ok-button"
          onclick="confirmCard()"
        >
          OK
        </button>

      </div>

    </div>

  </div>


  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen">

    <h1>🎱 BINGO</h1>

    <div class="game-info">
      <div class="game-number" id="gameNumber">
        Game
      </div>

      <div class="game-status" id="gameStatus">
        Game is running
      </div>
    </div>

    <div class="called-box">

      <div class="called-label">
        CURRENT NUMBER
      </div>

      <div class="current-number" id="currentNumber">
        -
      </div>

      <div class="called-label">
        Called numbers
      </div>

      <div
        class="called-history"
        id="calledHistory"
      ></div>

    </div>

    <div class="my-card-title" id="myCardTitle">
      My Card
    </div>

    <div id="gameBoard"></div>

    <button
      id="bingoButton"
      class="bingo-button"
      onclick="claimBingo()"
    >
      🏆 BINGO
    </button>

    <div id="resultArea"></div>

  </div>

</div>


<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let selectedCardNumber = null;
  let selectedBoard = null;

  let myCardNumber = null;
  let myBoard = null;

  let calledNumbers = [];
  let markedNumbers = [];

  let currentGameId = null;
  let currentGameStatus = null;

  let pollTimer = null;


  function initData() {

    return tg.initData || "";

  }


  async function api(url, options = {}) {

    options.headers = {
      ...(options.headers || {}),
      "Content-Type": "application/json"
    };

    const response = await fetch(url, options);

    let data;

    try {
      data = await response.json();
    } catch (e) {
      throw new Error("Invalid server response");
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Request failed"
      );

    }

    return data;

  }


  function showError(message) {

    document.getElementById("errorBox").innerHTML =
      `<div class="error">${escapeHtml(message)}</div>`;

  }


  function clearError() {

    document.getElementById("errorBox").innerHTML = "";

  }


  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function showScreen(screen) {

    document
      .querySelectorAll(".screen")
      .forEach(el => el.classList.remove("active"));

    document
      .getElementById(screen)
      .classList.add("active");

  }


  /*
   * LOAD CARD NUMBERS
   */

  async function loadCards() {

    clearError();

    const grid = document.getElementById("cardsGrid");

    grid.innerHTML =
      `<div class="loading">Loading cards...</div>`;

    try {

      const data = await api(
        `/api/cards?initData=${encodeURIComponent(initData())}`
      );

      const gameId = data.gameId;

      if (currentGameId === null) {
        currentGameId = gameId;
      }

      document.getElementById("selectionGame").textContent =
        `Game ${gameId}`;

      const usedCards =
        Array.isArray(data.usedCards)
          ? data.usedCards.map(Number)
          : [];

      /*
       * Always create ALL 100 buttons.
       */

      grid.innerHTML = "";

      for (let number = 1; number <= 100; number++) {

        const button = document.createElement("button");

        button.className = "card-number";

        button.textContent = number;

        if (usedCards.includes(number)) {

          button.classList.add("unavailable");

          button.disabled = true;

          button.title = "Already taken in this game";

        } else {

          button.addEventListener(
            "click",
            () => previewCard(number)
          );

        }

        grid.appendChild(button);

      }

    } catch (error) {

      grid.innerHTML = "";

      showError(error.message);

      /*
       * Even if the server response has a problem,
       * keep showing 1–100 rather than showing only
       * one card.
       */

      for (let number = 1; number <= 100; number++) {

        const button = document.createElement("button");

        button.className = "card-number";

        button.textContent = number;

        button.addEventListener(
          "click",
          () => previewCard(number)
        );

        grid.appendChild(button);

      }

    }

  }


  /*
   * PREVIEW CARD
   */

  async function previewCard(number) {

    clearError();

    selectedCardNumber = number;

    try {

      const data = await api(
        `/api/cards?initData=${encodeURIComponent(initData())}`
      );

      let board = null;

      if (Array.isArray(data.cards)) {

        const found = data.cards.find(
          card => Number(card.card_number) === number
        );

        if (found) {
          board = found.board;
        }

      }

      /*
       * Some server versions return cards
       * as an object instead of an array.
       */

      if (!board && data.cards && !Array.isArray(data.cards)) {

        const found =
          data.cards[number] ||
          data.cards[String(number)];

        if (found) {
          board = found.board || found;
        }

      }

      if (!board) {

        throw new Error(
          "Could not load this Bingo board."
        );

      }

      selectedBoard = board;

      document.getElementById("previewTitle").textContent =
        `Card #${number}`;

      document.getElementById("previewBoard").innerHTML =
        createBoardHtml(board, false);

      document.getElementById("previewBox").style.display =
        "block";

      document
        .getElementById("previewBox")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

    } catch (error) {

      showError(error.message);

    }

  }


  function cancelSelection() {

    selectedCardNumber = null;

    selectedBoard = null;

    document.getElementById("previewBox").style.display =
      "none";

  }


  /*
   * CONFIRM CARD
   */

  async function confirmCard() {

    if (!selectedCardNumber) {

      showError("Please choose a card first.");

      return;

    }

    clearError();

    try {

      const data = await api(
        "/api/select-card",
        {
          method: "POST",
          body: JSON.stringify({
            initData: initData(),
            cardNumber: selectedCardNumber
          })
        }
      );

      if (data.success || data.cardNumber) {

        myCardNumber =
          Number(
            data.cardNumber ||
            selectedCardNumber
          );

        myBoard =
          data.board ||
          selectedBoard;

        currentGameId =
          data.gameId ||
          currentGameId;

        selectedCardNumber = null;

        selectedBoard = null;

        document.getElementById("previewBox").style.display =
          "none";

        showScreen("gameScreen");

        renderMyBoard();

        await updateGameState();

      } else {

        throw new Error(
          data.error ||
          "Board unavailable"
        );

      }

    } catch (error) {

      /*
       * If another player took the card,
       * refresh the 1–100 list immediately.
       */

      showError(
        error.message ||
        "Board unavailable"
      );

      await loadCards();

    }

  }


  /*
   * LOAD MY CARD
   */

  async function loadMyCard() {

    try {

      const data = await api(
        `/api/my-card?initData=${encodeURIComponent(initData())}`
      );

      if (
        data &&
        data.cardNumber &&
        data.board
      ) {

        myCardNumber =
          Number(data.cardNumber);

        myBoard =
          data.board;

        if (data.gameId) {
          currentGameId = data.gameId;
        }

        showScreen("gameScreen");

        renderMyBoard();

      } else {

        myCardNumber = null;
        myBoard = null;

        showScreen("selectionScreen");

        await loadCards();

      }

    } catch (error) {

      /*
       * No card selected is not a fatal error.
       */

      myCardNumber = null;
      myBoard = null;

      showScreen("selectionScreen");

      await loadCards();

    }

  }


  /*
   * CREATE BOARD HTML
   */

  function createBoardHtml(board, playable) {

    if (!Array.isArray(board)) {

      return `<div class="error">
        Invalid Bingo board
      </div>`;

    }

    let html = `
      <table class="bingo-board ${playable ? "play-board" : ""}">
        <thead>
          <tr>
            <th>B</th>
            <th>I</th>
            <th>N</th>
            <th>G</th>
            <th>O</th>
          </tr>
        </thead>
        <tbody>
    `;

    for (let row = 0; row < 5; row++) {

      html += "<tr>";

      for (let col = 0; col < 5; col++) {

        const value =
          board[row][col];

        const isFree =
          row === 2 && col === 2;

        let classes = "";

        if (isFree) {
          classes += " free";
        }

        if (
          playable &&
          !isFree &&
          markedNumbers.includes(Number(value))
        ) {

          classes += " marked";

        } else if (
          playable &&
          !isFree &&
          calledNumbers.includes(Number(value))
        ) {

          classes += " called";

        }

        html += `
          <td
            class="${classes.trim()}"
            ${playable && !isFree
              ? `onclick="toggleMark(${Number(value)})"`
              : ""}
          >
            ${isFree ? "FREE" : escapeHtml(value)}
          </td>
        `;

      }

      html += "</tr>";

    }

    html += `
        </tbody>
      </table>
    `;

    return html;

  }


  /*
   * SHOW MY BOARD
   */

  function renderMyBoard() {

    if (!myBoard) return;

    document.getElementById("myCardTitle").textContent =
      `My Card #${myCardNumber}`;

    document.getElementById("gameBoard").innerHTML =
      createBoardHtml(myBoard, true);

  }


  /*
   * MARK / UNMARK NUMBER
   */

  async function toggleMark(number) {

    if (
      currentGameStatus &&
      currentGameStatus !== "playing"
    ) {

      return;

    }

    number = Number(number);

    if (!calledNumbers.includes(number)) {

      return;

    }

    const alreadyMarked =
      markedNumbers.includes(number);

    try {

      if (alreadyMarked) {

        await api(
          "/api/unmark",
          {
            method: "POST",
            body: JSON.stringify({
              initData: initData(),
              number
            })
          }
        );

        markedNumbers =
          markedNumbers.filter(
            n => Number(n) !== number
          );

      } else {

        await api(
          "/api/mark",
          {
            method: "POST",
            body: JSON.stringify({
              initData: initData(),
              number
            })
          }
        );

        if (!markedNumbers.includes(number)) {

          markedNumbers.push(number);

        }

      }

      renderMyBoard();

    } catch (error) {

      showError(error.message);

    }

  }


  /*
   * CLAIM BINGO
   */

  async function claimBingo() {

    const button =
      document.getElementById("bingoButton");

    button.disabled = true;

    button.textContent =
      "Checking...";

    try {

      const data = await api(
        "/api/bingo",
        {
          method: "POST",
          body: JSON.stringify({
            initData: initData()
          })
        }
      );

      if (data.bingo) {

        showWinner(
          data.winnerName ||
          "You",
          data.winnerCardNumber ||
          myCardNumber
        );

      } else {

        throw new Error(
          data.message ||
          "BINGO is not valid."
        );

      }

    } catch (error) {

      showError(error.message);

      button.disabled = false;

      button.textContent =
        "🏆 BINGO";

    }

  }


  /*
   * WINNER DISPLAY
   */

  function showWinner(name, cardNumber) {

    document.getElementById("resultArea").innerHTML = `
      <div class="result-box winner-box">

        <div class="result-title">
          🏆 BINGO!
        </div>

        <div class="result-text">
          Winner: <strong>${escapeHtml(name)}</strong><br>
          Winning Card: <strong>#${escapeHtml(cardNumber)}</strong>
        </div>

      </div>
    `;

    document.getElementById("bingoButton").style.display =
      "none";

  }


  /*
   * GAME OVER DISPLAY
   */

  function showGameOver(name, cardNumber) {

    document.getElementById("resultArea").innerHTML = `
      <div class="result-box gameover-box">

        <div class="result-title">
          GAME OVER
        </div>

        <div class="result-text">
          Winner: <strong>${escapeHtml(name)}</strong><br>
          Winning Card: <strong>#${escapeHtml(cardNumber)}</strong>
          <br><br>
          Better luck next time!
        </div>

      </div>
    `;

    document.getElementById("bingoButton").style.display =
      "none";

  }


  /*
   * UPDATE GAME STATE
   */

  async function updateGameState() {

    try {

      const data = await api(
        `/api/game-state?initData=${encodeURIComponent(initData())}`
      );

      const newGameId =
        Number(data.gameId);

      /*
       * Detect a NEW GAME.
       */

      if (
        currentGameId !== null &&
        newGameId !== currentGameId
      ) {

        currentGameId =
          newGameId;

        calledNumbers = [];

        markedNumbers = [];

        myCardNumber = null;

        myBoard = null;

        document.getElementById("resultArea").innerHTML =
          "";

        document.getElementById("bingoButton").style.display =
          "block";

        document.getElementById("bingoButton").disabled =
          false;

        document.getElementById("bingoButton").textContent =
          "🏆 BINGO";

        showScreen("selectionScreen");

        await loadCards();

        return;

      }

      currentGameId =
        newGameId;

      currentGameStatus =
        data.status;

      calledNumbers =
        Array.isArray(data.calledNumbers)
          ? data.calledNumbers.map(Number)
          : [];

      document.getElementById("gameNumber").textContent =
        `Game ${newGameId}`;

      if (data.currentNumber) {

        document.getElementById("currentNumber").textContent =
          data.currentNumber;

      } else {

        document.getElementById("currentNumber").textContent =
          "-";

      }

      renderCalledHistory();


      /*
       * GAME FINISHED
       */

      if (data.status === "finished") {

        const winnerName =
          data.winnerName ||
          "Another player";

        const winnerCard =
          data.winnerCardNumber ||
          "?";

        if (
          myCardNumber &&
          Number(myCardNumber) === Number(winnerCard)
        ) {

          /*
           * The winner sees winner message.
           */

          showWinner(
            winnerName,
            winnerCard
          );

        } else {

          /*
           * Everyone else sees GAME OVER.
           */

          showGameOver(
            winnerName,
            winnerCard
          );

        }

        return;

      }


      if (data.status === "playing") {

        document.getElementById("gameStatus").textContent =
          "Game is running";

        if (
          document.getElementById("bingoButton").style.display ===
          "none"
        ) {

          document.getElementById("bingoButton").style.display =
            "block";

        }

        renderMyBoard();

      }

    } catch (error) {

      console.log(
        "Game state error:",
        error
      );

    }

  }


  function renderCalledHistory() {

    const history =
      document.getElementById("calledHistory");

    history.innerHTML = "";

    /*
     * Newest first.
     */

    [...calledNumbers]
      .reverse()
      .forEach(number => {

        const span =
          document.createElement("span");

        span.textContent =
          number;

        history.appendChild(span);

      });

  }


  /*
   * AUTOMATIC POLLING
   */

  async function poll() {

    await updateGameState();

  }


  /*
   * START
   */

  async function start() {

    await loadMyCard();

    await updateGameState();

    if (!pollTimer) {

      pollTimer =
        setInterval(
          poll,
          1000
        );

    }

  }


  /*
   * START APP
   */

  start();

</script>

</body>
</html>
