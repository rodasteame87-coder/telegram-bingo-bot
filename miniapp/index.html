<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #222;
      text-align: center;
    }

    .top {
      max-width: 430px;
      margin: auto;
    }

    h1 {
      margin: 5px 0;
      font-size: 32px;
    }

    #playerName {
      font-size: 17px;
      margin-bottom: 12px;
      color: #555;
    }

    .last-called {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .last-title {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 5px;
    }

    #latest {
      font-size: 42px;
      font-weight: bold;
      color: #e53935;
    }

    #counter {
      margin-top: 5px;
      font-size: 15px;
      color: #666;
    }

    #status {
      margin: 10px 0;
      font-weight: bold;
    }

    .board {
      max-width: 430px;
      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 6px;
    }

    .header {
      background: #222;
      color: white;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 19px;
      font-weight: bold;
    }

    .cell {
      background: white;
      border-radius: 9px;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;

      box-shadow:
        0 2px 5px rgba(0,0,0,0.12);

      cursor: pointer;
      user-select: none;
    }

    /* Called number = WHITE */
    .cell.called {
      background: white;
      color: #222;
      border: 2px solid #35c759;
    }

    /* Player mark = GREEN */
    .cell.marked {
      background: #35c759;
      color: white;
      border: 2px solid #35c759;
    }

    /* FREE space = YELLOW */
    .cell.free {
      background: #ffcc00;
      color: #111;
      border: 2px solid #ffcc00;
    }

    .called-box {
      max-width: 430px;
      margin: 15px auto;

      background: white;

      border-radius: 15px;

      padding: 12px;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.10);
    }

    .called-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .number {
      display: inline-block;

      margin: 3px;

      padding: 6px 8px;

      border-radius: 7px;

      background: #e5e7eb;

      font-size: 13px;
      font-weight: bold;
    }

    button {
      width: 100%;
      max-width: 430px;

      margin-top: 5px;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #e53935;

      color: white;

      font-size: 21px;

      font-weight: bold;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.15);
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      max-width: 430px;

      margin: 15px auto;

      font-size: 18px;

      font-weight: bold;
    }

    .help {
      max-width: 430px;

      margin: 15px auto 5px;

      font-size: 13px;

      color: #777;
    }

  </style>
</head>

<body>

  <div class="top">

    <h1>🎱 BINGO</h1>

    <div id="playerName">
      Loading player...
    </div>

    <div class="last-called">

      <div class="last-title">
        🔔 LAST CALLED
      </div>

      <div id="latest">
        --
      </div>

      <div id="counter">
        0/75 numbers called
      </div>

    </div>

    <div id="status">
      🔄 Loading game...
    </div>

  </div>


  <div class="board">

    <div class="header">B</div>
    <div class="header">I</div>
    <div class="header">N</div>
    <div class="header">G</div>
    <div class="header">O</div>

    <div id="cell-0-0" class="cell"></div>
    <div id="cell-0-1" class="cell"></div>
    <div id="cell-0-2" class="cell"></div>
    <div id="cell-0-3" class="cell"></div>
    <div id="cell-0-4" class="cell"></div>

    <div id="cell-1-0" class="cell"></div>
    <div id="cell-1-1" class="cell"></div>
    <div id="cell-1-2" class="cell"></div>
    <div id="cell-1-3"
