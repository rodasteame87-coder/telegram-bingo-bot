<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 5px 0 15px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .infoBox {
      background: #1f2937;
      border-radius: 12px;
      padding: 10px 5px;
      font-size: 13px;
    }

    .infoValue {
      display: block;
      margin-top: 5px;
      font-size: 15px;
      font-weight: bold;
    }

    .lastCalled {
      background: #1f2937;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .lastNumber {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .board {
      max-width: 420px;
      margin: 0 auto;
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 5px;
    }

    .letter {
      font-size: 20px;
      font-weight: bold;
      padding: 8px;
    }

    .card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #374151;
      border: 2px solid #4b5563;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .cell.called {
      background: white;
      color: #222;
      border: 2px solid #35c759;
    }

    .cell.marked {
      background: #35c759;
      color: white;
      border: 2px solid #35c759;
    }

    .cell.free {
      background: #ffcc00;
      color: #111;
      border: 2px solid #ffcc00;
      cursor: default;
    }

    .calledNumbers {
      margin-top: 20px;
      background: #1f2937;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .number {
      background: #374151;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
    }

    .bingoButton {
      width: 100%;
      max-width: 420px;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #35c759;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .bingoButton:active {
      transform: scale(0.98);
    }

    .winner {
      background: #ffcc00;
      color: #111;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-weight: bold;
    }

    .message {
      margin-top: 10px;
      min-height: 22px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>🎱 BINGO</h1>

  <div class="info">

    <div class="infoBox">
      👑 Host
      <span
        id="hostName"
        class="infoValue"
      >
        Loading...
      </span>
    </div>

    <div class="infoBox">
      👥 Players
      <span
        id="playerCount"
        class="infoValue"
      >
        0
      </span>
    </div>

    <div class="infoBox">
      🎱 Called
      <span
        id="calledCount"
        class="infoValue"
      >
        0/75
      </span>
    </div>

  </div>

  <div class="infoBox" style="margin-bottom:15px;">
    👤 You
    <span
      id="playerName"
      class="infoValue"
    >
      Loading...
    </span>
  </div>

  <div class="lastCalled">
    Last called number
    <div
      id="lastCalled"
      class="lastNumber"
    >
      —
    </div>
  </div>

  <div class="board">

    <div class="letters">
      <div class="letter">B</div>
      <div class="letter">I</div>
      <div class="letter">N</div>
      <div class="letter">G</div>
      <div class="letter">O</div>
    </div>

    <div
      id="card"
      class="card"
    ></div>

  </div>

  <div class="calledNumbers">

    <strong>🎱 Called Numbers</strong>

    <div
      id="numbers"
      class="numbers"
    >
      —
    </div>

  </div>

  <button
    id="bingoButton"
    class="bingoButton"
  >
    🏆 BINGO!
  </button>

  <div
    id="winner"
    class="winner"
    style="display:none;"
  ></div>

  <div
    id="message"
    class="message"
  ></div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.expand();

    const userId =
      tg.initDataUnsafe?.user?.id;

    const chatId =
      tg.initDataUnsafe?.start_param || "";

    let card = [];
    let calledNumbers = [];
    let markedNumbers = new Set();

    async function loadCard() {
      if (!userId || !chatId) {
        document.getElementById("message").innerText =
          "❌ Could not identify the game.";
        return;
      }

      try {
        const response = await fetch(
          `/api/card?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(userId)}`
        );

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("message").innerText =
            "❌ " + (data.error || "Could not load card.");
          return;
        }

        card = data.card || [];
        calledNumbers = data.calledNumbers || [];

        // Load saved marks from PostgreSQL.
        markedNumbers = new Set(
          (data.markedNumbers || []).map(String)
        );

        document.getElementById("playerName").innerText =
          "👤 " + data.name;

        document.getElementById("hostName").innerText =
          data.hostName || "Unknown";

        document.getElementById("playerCount").innerText =
          data.playerCount || 0;

        document.getElementById("calledCount").innerText =
          calledNumbers.length + "/75";

        if (calledNumbers.length > 0) {
          const last =
            calledNumbers[calledNumbers.length - 1];

          document.getElementById("lastCalled").innerText =
            last;
        } else {
          document.getElementById("lastCalled").innerText =
            "—";
        }

        displayCard();
        displayCalledNumbers();

        if (data.winner) {
          const winnerBox =
            document.getElementById("winner");

          winnerBox.style.display = "block";

          winnerBox.innerText =
            `🏆 Winner: ${data.winner}`;

          document.getElementById(
            "bingoButton"
          ).disabled = true;
        }

      } catch (error) {
        console.error(error);

        document.getElementById("message").innerText =
          "❌ Connection error.";
      }
    }

    function displayCard() {
      const cardElement =
        document.getElementById("card");

      cardElement.innerHTML = "";

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {

          const value = card[row][col];

          const cell =
            document.createElement("div");

          cell.className = "cell";

          cell.innerText = value;

          if (value === "FREE") {

            cell.classList.add("free");

          } else if (
            markedNumbers.has(String(value))
          ) {

            cell.classList.add("marked");

          } else if (
            calledNumbers.includes(Number(value))
          ) {

            cell.classList.add("called");
          }

          if (value !== "FREE") {
            cell.addEventListener(
              "click",
              () => toggleMark(value)
            );
          }

          cardElement.appendChild(cell);
        }
      }
    }

    async function toggleMark(value) {
      const valueString = String(value);

      const isMarked =
        markedNumbers.has(valueString);

      if (isMarked) {

        markedNumbers.delete(valueString);

        displayCard();

        await fetch("/api/unmark", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chatId: chatId,
            userId: userId,
            number: value
          })
        });

      } else {

        // Only allow marking called numbers.
        if (
          !calledNumbers.includes(Number(value))
        ) {
          document.getElementById("message").innerText =
            "⚪ That number has not been called yet.";

          setTimeout(() => {
            document.getElementById("message").innerText =
              "";
          }, 1800);

          return;
        }

        markedNumbers.add(valueString);

        displayCard();

        await fetch("/api/mark", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chatId: chatId,
            userId: userId,
            number: value
          })
        });
      }
    }

    function displayCalledNumbers() {
      const numbersElement =
        document.getElementById("numbers");

      numbersElement.innerHTML = "";

      if (calledNumbers.length === 0) {
        numbersElement.innerText = "No numbers called yet.";
        return;
      }

      calledNumbers.forEach(number => {

        const item =
          document.createElement("div");

        item.className = "number";

        item.innerText = number;

        numbersElement.appendChild(item);
      });
    }

    async function claimBingo() {
      const button =
        document.getElementById("bingoButton");

      button.disabled = true;

      document.getElementById("message").innerText =
        "🔎 Checking Bingo...";

      try {
        const response = await fetch(
          `/api/bingo?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(userId)}`
        );

        const data = await response.json();

        if (data.bingo) {

          document.getElementById("message").innerText =
            "🏆 BINGO!";

          const winnerBox =
            document.getElementById("winner");

          winnerBox.style.display = "block";

          winnerBox.innerText =
            `🏆 Winner: ${data.winner}`;

        } else {

          document.getElementById("message").innerText =
            "❌ No Bingo yet.";

          button.disabled = false;
        }

      } catch (error) {

        console.error(error);

        document.getElementById("message").innerText =
          "❌ Could not check Bingo.";

        button.disabled = false;
      }
    }

    document
      .getElementById("bingoButton")
      .addEventListener(
        "click",
        claimBingo
      );

    // Initial load
    loadCard();

    // Keep game information updated.
    setInterval(
      loadCard,
      3000
    );
  </script>

</body>
</html>
