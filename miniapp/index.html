<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎱 Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .status {
      margin: 10px 0 20px;
      font-weight: bold;
    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-width: 400px;
      margin: auto;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header {
      background: #2196f3;
      color: white;
    }

    .free {
      background: #4caf50;
      color: white;
    }

    .marked {
      background: #ff9800;
      color: white;
    }

    .called {
      border: 4px solid #f44336;
      box-sizing: border-box;
    }

    button {
      margin-top: 25px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      background: #2196f3;
      color: white;
    }
  </style>
</head>

<body>

  <h1>🎱 Bingo</h1>

  <div id="playerName" class="subtitle">
    Loading player...
  </div>

  <div id="status" class="status">
    Loading game...
  </div>

  <div id="board" class="bingo-board"></div>

  <button onclick="loadCard()">🔄 Refresh</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const playerName = document.getElementById("playerName");
    const status = document.getElementById("status");
    const board = document.getElementById("board");

    async function loadCard() {

      const user = tg.initDataUnsafe.user;

      if (!user) {
        playerName.textContent = "Telegram user not found";
        status.textContent = "Please open this Mini App from Telegram.";
        return;
      }

      playerName.textContent =
        "👤 " + (user.first_name || "Player");

      status.textContent = "🔎 Looking for your Bingo game...";

      /*
        The current bot stores games by GROUP CHAT ID.

        Telegram Mini Apps opened from the bot's private menu
        do not automatically provide the group chat ID.

        Therefore, this version checks whether the bot has
        provided a game ID through Telegram start parameters.
      */

      const startParam = tg.initDataUnsafe.start_param;

      if (!startParam) {
        status.textContent =
          "⚠️ Open the Mini App from a Bingo game link.";
        board.innerHTML = "";
        return;
      }

      const chatId = startParam;

      try {

        const response = await fetch(
          `/api/card?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(user.id)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Game not found");
        }

        displayCard(
          data.card,
          data.calledNumbers || []
        );

        status.textContent =
          "🎮 Bingo game connected";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ " + error.message;

        board.innerHTML = "";
      }
    }

    function displayCard(card, calledNumbers) {

      board.innerHTML = "";

      const letters = ["B", "I", "N", "G", "O"];

      for (let i = 0; i < 5; i++) {

        const header = document.createElement("div");

        header.className = "cell header";

        header.textContent = letters[i];

        board.appendChild(header);
      }

      for (let row = 0; row < 5; row++) {

        for (let column = 0; column < 5; column++) {

          const cell = document.createElement("div");

          cell.className = "cell";

          const value = card[row][column];

          cell.textContent = value;

          if (value === "FREE") {
            cell.classList.add("free");
          }

          if (
            value !== "FREE" &&
            calledNumbers.includes(value)
          ) {
            cell.classList.add("called");
          }

          cell.onclick = function() {

            if (value !== "FREE") {
              cell.classList.toggle("marked");
            }

          };

          board.appendChild(cell);
        }
      }
    }

    loadCard();
  </script>

</body>
</html>
