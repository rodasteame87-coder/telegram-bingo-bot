<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Telegram Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
    }

    .info {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .info div {
      margin: 5px 0;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    .last {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #111827;
      padding: 6px;
      border-radius: 14px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px, 5vw, 25px);
      font-weight: bold;
      background: white;
      color: #111827;
      cursor: pointer;
      user-select: none;
    }

    .header {
      background: #374151;
      color: white;
      cursor: default;
    }

    .called {
      border: 4px solid #16a34a;
    }

    .marked {
      background: #16a34a;
      color: white;
    }

    .free {
      background: #facc15;
      color: #111827;
      cursor: default;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }

    .winner {
      background: #fef3c7;
      color: #92400e;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎱 Bingo</h1>

  <div id="loading" class="loading">
    Loading your card...
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div id="game" style="display:none;">

    <div class="info">
      <div>
        👤 Player:
        <strong id="playerName">-</strong>
      </div>

      <div>
        👑 Host:
        <strong id="hostName">-</strong>
      </div>

      <div>
        👥 Players:
        <strong id="playerCount">-</strong>
      </div>

      <div>
        🎱 Called:
        <strong id="calledCount">0</strong>/75
      </div>
    </div>

    <div
      id="winner"
      class="winner"
      style="display:none;"
    ></div>

    <div id="lastCalled" class="last">
      Waiting for numbers...
    </div>

    <div class="board" id="board">

      <div class="cell header">B</div>
      <div class="cell header">I</div>
      <div class="cell header">N</div>
      <div class="cell header">G</div>
      <div class="cell header">O</div>

    </div>

    <button id="bingoButton">
      🎉 BINGO!
    </button>

    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const API = window.location.origin;

  let chatId = null;
  let userId = null;
  let currentData = null;

  function showError(message) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("game").style.display = "none";

    const error = document.getElementById("error");

    error.textContent = message;
    error.style.display = "block";
  }

  function getIds() {
    userId =
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user.id
        : null;

    /*
      Telegram Main Mini App direct links put the
      /play chat ID into start_param.
    */

    if (
      tg.initDataUnsafe &&
      tg.initDataUnsafe.start_param
    ) {
      chatId = tg.initDataUnsafe.start_param;
    }

    /*
      Additional fallback in case Telegram exposes
      the value in the page URL.
    */

    if (!chatId) {
      const params =
        new URLSearchParams(window.location.search);

      chatId =
        params.get("startapp") ||
        params.get("start_param") ||
        params.get("chatId");
    }

    if (chatId) {
      chatId = String(chatId);
    }

    if (userId) {
      userId = String(userId);
    }
  }

  async function loadCard() {
    try {
      getIds();

      if (!chatId) {
        return showError(
          "Could not identify the Bingo game. Please open the Mini App using /play from your Bingo group."
        );
      }

      if (!userId) {
        return showError(
          "Could not identify your Telegram account. Please open this inside Telegram."
        );
      }

      const response = await fetch(
        `${API}/api/card?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(userId)}`
      );

      const data = await response.json();

      if (!response.ok) {
        return showError(
          data.error || "Could not load your Bingo card."
        );
      }

      currentData = data;

      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "none";
      document.getElementById("game").style.display = "block";

      document.getElementById("playerName").textContent =
        data.name;

      document.getElementById("hostName").textContent =
        data.hostName;

      document.getElementById("playerCount").textContent =
        data.playerCount;

      const calledNumbers =
        data.calledNumbers || [];

      document.getElementById("calledCount").textContent =
        calledNumbers.length;

      if (calledNumbers.length > 0) {
        document.getElementById("lastCalled").textContent =
          `🎱 Last called: ${calledNumbers[calledNumbers.length - 1]}`;
      } else {
        document.getElementById("lastCalled").textContent =
          "Waiting for numbers...";
      }

      if (data.winner) {
        const winnerBox =
          document.getElementById("winner");

        winnerBox.textContent =
          `🏆 ${data.winner} won this game!`;

        winnerBox.style.display = "block";
      }

      renderBoard(data);

    } catch (error) {
      console.error(error);

      showError(
        "Could not connect to the Bingo server."
      );
    }
  }

  function renderBoard(data) {
    const board =
      document.getElementById("board");

    board.innerHTML = "";

    const headers = ["B", "I", "N", "G", "O"];

    headers.forEach(letter => {
      const cell =
        document.createElement("div");

      cell.className =
        "cell header";

      cell.textContent = letter;

      board.appendChild(cell);
    });

    const calledNumbers =
      data.calledNumbers || [];

    const markedNumbers =
      data.markedNumbers || [];

    data.card.forEach(row => {
      row.forEach(value => {

        const cell =
          document.createElement("div");

        cell.className = "cell";

        cell.textContent = value;

        if (value === "FREE") {
          cell.classList.add("free");
        } else {

          const number =
            Number(value);

          if (calledNumbers.includes(number)) {
            cell.classList.add("called");
          }

          if (markedNumbers.includes(number)) {
            cell.classList.add("marked");
          }

          cell.addEventListener(
            "click",
            () => toggleNumber(
              number,
              cell
            )
          );
        }

        board.appendChild(cell);
      });
    });
  }

  async function toggleNumber(number, cell) {
    if (!currentData) return;

    const calledNumbers =
      currentData.calledNumbers || [];

    if (!calledNumbers.includes(number)) {
      document.getElementById("status").textContent =
        "⚠️ That number has not been called yet.";

      return;
    }

    const markedNumbers =
      currentData.markedNumbers || [];

    const isMarked =
      markedNumbers.includes(number);

    try {
      const response = await fetch(
        `${API}/${isMarked ? "api/unmark" : "api/mark"}`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            chatId,
            userId,
            number
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok) {
        document.getElementById("status").textContent =
          data.error || "Could not update number.";

        return;
      }

      currentData.markedNumbers =
        data.markedNumbers || [];

      renderBoard(currentData);

      document.getElementById("status").textContent =
        isMarked
          ? `Number ${number} unmarked.`
          : `Number ${number} marked.`;

    } catch (error) {
      console.error(error);

      document.getElementById("status").textContent =
        "Could not save your mark.";
    }
  }

  document
    .getElementById("bingoButton")
    .addEventListener(
      "click",
      async () => {

        try {

          const response = await fetch(
            `${API}/api/bingo`,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                chatId,
                userId
              })
            }
          );

          const data =
            await response.json();

          if (!response.ok) {
            document.getElementById("status").textContent =
              data.error || "Could not check Bingo.";

            return;
          }

          if (data.bingo) {

            document.getElementById("status").textContent =
              `🎉 BINGO! ${data.winner} wins!`;

            await loadCard();

          } else {

            document.getElementById("status").textContent =
              "❌ No Bingo yet. Complete a row, column, or diagonal.";

          }

        } catch (error) {

          console.error(error);

          document.getElementById("status").textContent =
            "Could not check Bingo.";

        }
      }
    );

  loadCard();

  setInterval(
    loadCard,
    3000
  );
</script>

</body>
</html>
