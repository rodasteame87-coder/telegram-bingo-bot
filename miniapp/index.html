<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 16px;
}

h1 {
  text-align: center;
  margin: 5px 0 8px;
  font-size: 28px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 18px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.game-info {
  background: #1f2937;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  text-align: center;
}

.game-number {
  font-size: 18px;
  font-weight: bold;
}

.game-status {
  margin-top: 5px;
  color: #9ca3af;
  font-size: 14px;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.card-number {
  border: none;
  border-radius: 10px;
  padding: 14px 5px;
  font-size: 17px;
  font-weight: bold;
  background: #2563eb;
  color: white;
}

.card-number:active {
  transform: scale(.95);
}

.card-number.unavailable {
  background: #4b5563;
  color: #9ca3af;
}

.legend {
  text-align: center;
  margin: 15px 0;
  color: #9ca3af;
  font-size: 13px;
}

.preview-box {
  background: #1f2937;
  border-radius: 14px;
  padding: 15px;
  margin-top: 15px;
}

.preview-title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.bingo-board {
  width: 100%;
  border-collapse: separate;
  border-spacing: 4px;
}

.bingo-board th {
  font-size: 18px;
  padding: 7px;
}

.bingo-board td {
  background: #374151;
  border-radius: 7px;
  text-align: center;
  padding: 12px 2px;
  font-size: 16px;
  font-weight: bold;
}

.free {
  background: #16a34a !important;
}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button.main-button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: 17px;
  font-weight: bold;
}

.ok-button {
  background: #16a34a;
  color: white;
}

.back-button {
  background: #4b5563;
  color: white;
}

.called-box {
  background: #1f2937;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  margin-bottom: 14px;
}

.called-label {
  color: #9ca3af;
  font-size: 14px;
}

.current-number {
  font-size: 56px;
  font-weight: bold;
  margin: 8px 0 12px;
}

.called-history {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  max-height: 120px;
  overflow-y: auto;
}

.called-history span {
  background: #2563eb;
  border-radius: 7px;
  padding: 5px 8px;
  font-size: 13px;
}

.called-history span.latest {
  background: #16a34a;
  font-size: 15px;
  font-weight: bold;
}

.my-card-title {
  text-align: center;
  margin: 12px 0;
  font-size: 20px;
  font-weight: bold;
}

.play-board td {
  cursor: pointer;
  user-select: none;
}

.play-board td.called {
  background: #2563eb;
}

.play-board td.marked {
  background: #16a34a;
}

.play-board td.free {
  background: #16a34a !important;
}

.bingo-button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  margin-top: 15px;
  background: #dc2626;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.result-box {
  border-radius: 14px;
  padding: 20px;
  margin-top: 15px;
  text-align: center;
}

.winner-box {
  background: #14532d;
}

.gameover-box {
  background: #7f1d1d;
}

.result-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 10px;
}

.result-text {
  font-size: 17px;
  line-height: 1.5;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #9ca3af;
}

.error {
  background: #7f1d1d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}

.success {
  background: #14532d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= SELECTION SCREEN ================= -->

<div id="selectionScreen" class="screen active">

<h1>🎱 BINGO</h1>

<div class="subtitle">
Choose your card
</div>

<div class="game-info">

<div class="game-number" id="selectionGame">
Game
</div>

<div class="game-status" id="selectionStatus">
Choose one card from 1–100
</div>

</div>

<div id="errorBox"></div>

<div id="cardsGrid" class="cards-grid">
<div class="loading">
Loading cards...
</div>
</div>

<div class="legend">
🔵 Available &nbsp;&nbsp; ⚫ Already taken
</div>

<div id="previewBox" class="preview-box" style="display:none;">

<div class="preview-title" id="previewTitle">
Card
</div>

<div id="previewBoard"></div>

<div class="button-row">

<button
class="main-button back-button"
id="backButton"
>
Back
</button>

<button
class="main-button ok-button"
id="confirmButton"
>
OK
</button>

</div>

</div>

</div>


<!-- ================= GAME SCREEN ================= -->

<div id="gameScreen" class="screen">

<h1>🎱 BINGO</h1>

<div class="game-info">

<div class="game-number" id="gameNumber">
Game
</div>

<div class="game-status" id="gameStatus">
Game is running
</div>

</div>

<div class="called-box">

<div class="called-label">
CURRENT NUMBER
</div>

<div class="current-number" id="currentNumber">
-
</div>

<div class="called-label">
Called numbers
</div>

<div class="called-history" id="calledHistory"></div>

</div>

<div class="my-card-title" id="myCardTitle">
My Card
</div>

<div id="gameBoard"></div>

<button id="bingoButton" class="bingo-button">
🏆 BINGO
</button>

<div id="resultArea"></div>

</div>

</div>


<script>

const tg =
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =====================================================
   VARIABLES
===================================================== */

let selectedCardNumber = null;
let selectedBoard = null;

let myCardNumber = null;
let myBoard = null;

let calledNumbers = [];
let markedNumbers = [];

let currentGameId = null;
let currentGameStatus = "waiting";

let appStarted = false;
let gamePolling = null;


/* =====================================================
   TELEGRAM
===================================================== */

function getInitData() {

  if (!tg) {
    return "";
  }

  return tg.initData || "";

}


function getUserId() {

  if (
    !tg ||
    !tg.initDataUnsafe ||
    !tg.initDataUnsafe.user ||
    !tg.initDataUnsafe.user.id
  ) {
    return null;
  }

  return Number(
    tg.initDataUnsafe.user.id
  );

}


function requireUserId() {

  const userId =
    getUserId();

  if (!userId) {

    throw new Error(
      "Telegram User ID is missing. Please open the Bingo game from Telegram."
    );

  }

  return userId;

}


/* =====================================================
   API
===================================================== */

async function api(url, options = {}) {

  const requestOptions = {
    ...options,
    cache: "no-store",
    headers: {
      ...(options.headers || {}),
      "Content-Type": "application/json",
      "Cache-Control": "no-cache"
    }
  };

  const response =
    await fetch(
      url,
      requestOptions
    );

  let data;

  try {

    data =
      await response.json();

  } catch {

    throw new Error(
      "Invalid server response."
    );

  }

  if (!response.ok) {

    throw new Error(
      data.message ||
      data.error ||
      `Server error ${response.status}`
    );

  }

  return data;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   ERRORS
===================================================== */

function showError(message) {

  document.getElementById(
    "errorBox"
  ).innerHTML = `
    <div class="error">
      ${escapeHtml(message)}
    </div>
  `;

}


function clearError() {

  document.getElementById(
    "errorBox"
  ).innerHTML = "";

}


/* =====================================================
   SCREEN
===================================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  const screen =
    document.getElementById(id);

  if (screen) {
    screen.classList.add("active");
  }

}


/* =====================================================
   BOARD NORMALIZER
===================================================== */

function normalizeBoard(board) {

  if (!board) {
    return null;
  }

  if (typeof board === "string") {

    try {
      board = JSON.parse(board);
    } catch {
      return null;
    }

  }


  if (Array.isArray(board)) {

    if (board.length !== 5) {
      return null;
    }

    for (let r = 0; r < 5; r++) {

      if (
        !Array.isArray(board[r]) ||
        board[r].length !== 5
      ) {
        return null;
      }

    }

    return board;

  }


  if (
    typeof board === "object" &&
    board !== null
  ) {

    const B = board.B;
    const I = board.I;
    const N = board.N;
    const G = board.G;
    const O = board.O;

    if (
      !Array.isArray(B) ||
      !Array.isArray(I) ||
      !Array.isArray(N) ||
      !Array.isArray(G) ||
      !Array.isArray(O)
    ) {
      return null;
    }

    if (
      B.length !== 5 ||
      I.length !== 5 ||
      N.length !== 5 ||
      G.length !== 5 ||
      O.length !== 5
    ) {
      return null;
    }

    return [

      [B[0], I[0], N[0], G[0], O[0]],

      [B[1], I[1], N[1], G[1], O[1]],

      [B[2], I[2], N[2], G[2], O[2]],

      [B[3], I[3], N[3], G[3], O[3]],

      [B[4], I[4], N[4], G[4], O[4]]

    ];

  }

  return null;

}


/* =====================================================
   LOAD CARDS
===================================================== */

async function loadCards() {

  const grid =
    document.getElementById(
      "cardsGrid"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading cards...
    </div>
  `;

  try {

    const data =
      await api(
        `/api/cards?_=${Date.now()}`
      );

    currentGameId =
      Number(data.gameId || 0);

    document.getElementById(
      "selectionGame"
    ).textContent =
      `Game ${currentGameId}`;


    const usedCards =
      Array.isArray(data.usedCards)
      ? data.usedCards.map(Number)
      : [];


    const usedBy =
      data.usedBy || {};


    grid.innerHTML = "";


    for (
      let number = 1;
      number <= 100;
      number++
    ) {

      const button =
        document.createElement("button");

      button.className =
        "card-number";

      button.textContent =
        number;


      if (
        usedCards.includes(number)
      ) {

        button.classList.add(
          "unavailable"
        );

        button.disabled =
          true;


        const owner =
          usedBy[String(number)];


        if (
          owner &&
          owner.name
        ) {

          button.title =
            `Taken by ${owner.name}`;

        }

      } else {

        button.addEventListener(
          "click",
          () => previewCard(number)
        );

      }

      grid.appendChild(button);

    }

  } catch (error) {

    console.error(
      "LOAD CARDS ERROR:",
      error
    );

    grid.innerHTML = "";

    showError(
      error.message ||
      "Could not load cards."
    );

  }

}


/* =====================================================
   GET ONE CARD
===================================================== */

async function getCard(number) {

  const data =
    await api(
      `/api/card?number=${encodeURIComponent(number)}&_=${Date.now()}`
    );


  if (
    data.success !== true
  ) {

    throw new Error(
      data.message ||
      "Card could not be loaded."
    );

  }


  const board =
    normalizeBoard(data.board) ||
    normalizeBoard(data.card);


  if (!board) {

    throw new Error(
      `Card #${number} has an invalid Bingo board.`
    );

  }


  return {
    ...data,
    board
  };

}


/* =====================================================
   PREVIEW CARD
===================================================== */

async function previewCard(number) {

  clearError();

  selectedCardNumber = null;
  selectedBoard = null;


  const previewBox =
    document.getElementById(
      "previewBox"
    );


  previewBox.style.display =
    "block";


  document.getElementById(
    "previewTitle"
  ).textContent =
    `Loading Card #${number}...`;


  document.getElementById(
    "previewBoard"
  ).innerHTML = `
    <div class="loading">
      Loading Bingo board...
    </div>
  `;


  try {

    const data =
      await getCard(number);


    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );


    if (
      data.available === false
    ) {

      const owner =
        data.takenBy &&
        data.takenBy.name;


      throw new Error(
        owner
        ? `Card #${number} is already taken by ${owner}.`
        : `Card #${number} is already taken.`
      );

    }


    selectedCardNumber =
      Number(
        data.cardNumber ||
        number
      );


    selectedBoard =
      data.board;


    document.getElementById(
      "previewTitle"
    ).textContent =
      `Card #${selectedCardNumber}`;


    document.getElementById(
      "previewBoard"
    ).innerHTML =
      createBoardHtml(
        selectedBoard,
        false
      );


    previewBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });


  } catch (error) {

    console.error(
      "PREVIEW ERROR:",
      error
    );


    previewBox.style.display =
      "none";


    showError(
      error.message ||
      "Could not load Bingo card."
    );

  }

}


/* =====================================================
   CANCEL
===================================================== */

function cancelSelection() {

  selectedCardNumber = null;
  selectedBoard = null;

  document.getElementById(
    "previewBox"
  ).style.display =
    "none";

  clearError();

}


/* =====================================================
   CONFIRM CARD
===================================================== */

async function confirmCard() {

  if (!selectedCardNumber) {

    showError(
      "Please choose a card first."
    );

    return;

  }


  const number =
    Number(selectedCardNumber);


  const button =
    document.getElementById(
      "confirmButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Selecting...";


  clearError();


  try {

    const userId =
      requireUserId();


    const data =
      await api(
        "/api/select-card",
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData(),

            userId:
              userId,

            cardNumber:
              number

          })

        }
      );


    if (
      data.success !== true
    ) {

      throw new Error(
        data.message ||
        data.error ||
        "Could not select this card."
      );

    }


    const board =
      normalizeBoard(data.board) ||
      normalizeBoard(data.card) ||
      normalizeBoard(selectedBoard);


    if (!board) {

      throw new Error(
        "Card was selected but the Bingo board could not be displayed."
      );

    }


    myCardNumber =
      Number(
        data.cardNumber ||
        number
      );


    myBoard =
      board;


    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );


    markedNumbers = [];
    calledNumbers = [];


    selectedCardNumber = null;
    selectedBoard = null;


    document.getElementById(
      "previewBox"
    ).style.display =
      "none";


    document.getElementById(
      "resultArea"
    ).innerHTML =
      "";


    document.getElementById(
      "bingoButton"
    ).style.display =
      "block";


    document.getElementById(
      "bingoButton"
    ).disabled =
      false;


    document.getElementById(
      "bingoButton"
    ).textContent =
      "🏆 BINGO";


    showScreen(
      "gameScreen"
    );


    renderMyBoard();


    /*
     * IMPORTANT:
     * Immediately get the current called
     * number instead of waiting for the
     * next 1-second polling cycle.
     */

    await updateGameState();


  } catch (error) {

    console.error(
      "CONFIRM CARD ERROR:",
      error
    );


    showError(
      error.message ||
      "Could not select Bingo card."
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "OK";

  }

}


/* =====================================================
   LOAD MY CARD
===================================================== */

async function loadMyCard() {

  try {

    const userId =
      requireUserId();


    const data =
      await api(
        `/api/my-card?initData=${encodeURIComponent(getInitData())}&userId=${encodeURIComponent(userId)}&_=${Date.now()}`
      );


    if (
      !data ||
      !data.cardNumber
    ) {

      myCardNumber = null;
      myBoard = null;
      markedNumbers = [];


      showScreen(
        "selectionScreen"
      );


      await loadCards();

      return;

    }


    const board =
      normalizeBoard(data.board) ||
      normalizeBoard(data.card);


    if (!board) {

      myCardNumber = null;
      myBoard = null;
      markedNumbers = [];


      showScreen(
        "selectionScreen"
      );


      await loadCards();

      return;

    }


    myCardNumber =
      Number(data.cardNumber);


    myBoard =
      board;


    markedNumbers =
      Array.isArray(data.markedNumbers)
      ? data.markedNumbers.map(Number)
      : [];


    currentGameId =
      Number(
        data.gameId ||
        currentGameId ||
        0
      );


    showScreen(
      "gameScreen"
    );


    renderMyBoard();

  } catch (error) {

    console.log(
      "NO EXISTING CARD:",
      error
    );


    myCardNumber = null;
    myBoard = null;
    markedNumbers = [];


    showScreen(
      "selectionScreen"
    );


    if (
      error.message &&
      error.message.includes(
        "Telegram User ID is missing"
      )
    ) {

      showError(
        error.message
      );

      return;

    }


    await loadCards();

  }

}


/* =====================================================
   BOARD HTML
===================================================== */

function createBoardHtml(
  board,
  playable
) {

  board =
    normalizeBoard(board);


  if (!board) {

    return `
      <div class="error">
        Could not display Bingo board.
      </div>
    `;

  }


  let html = `
    <table class="bingo-board ${
      playable ? "play-board" : ""
    }">

    <thead>
      <tr>
        <th>B</th>
        <th>I</th>
        <th>N</th>
        <th>G</th>
        <th>O</th>
      </tr>
    </thead>

    <tbody>
  `;


  for (
    let row = 0;
    row < 5;
    row++
  ) {

    html += "<tr>";


    for (
      let col = 0;
      col < 5;
      col++
    ) {

      const value =
        board[row][col];


      const free =
        row === 2 &&
        col === 2;


      const numeric =
        Number(value);


      let classes = "";


      if (free) {

        classes += " free";

      }


      if (
        playable &&
        !free &&
        Number.isFinite(numeric) &&
        markedNumbers.includes(numeric)
      ) {

        classes += " marked";

      } else if (
        playable &&
        !free &&
        Number.isFinite(numeric) &&
        calledNumbers.includes(numeric)
      ) {

        classes += " called";

      }


      let click = "";


      if (
        playable &&
        !free &&
        Number.isFinite(numeric)
      ) {

        click =
          `onclick="toggleMark(${numeric})"`;

      }


      html += `
        <td
          class="${classes.trim()}"
          ${click}
        >
          ${
            free
            ? "FREE"
            : escapeHtml(value)
          }
        </td>
      `;

    }


    html += "</tr>";

  }


  html += `
    </tbody>
    </table>
  `;


  return html;

}


/* =====================================================
   RENDER MY BOARD
===================================================== */

function renderMyBoard() {

  if (!myBoard) {
    return;
  }


  document.getElementById(
    "myCardTitle"
  ).textContent =
    `My Card #${myCardNumber}`;


  document.getElementById(
    "gameBoard"
  ).innerHTML =
    createBoardHtml(
      myBoard,
      true
    );

}


/* =====================================================
   MARK / UNMARK
===================================================== */

async function toggleMark(number) {

  number =
    Number(number);


  if (
    currentGameStatus !== "playing"
  ) {
    return;
  }


  if (
    !calledNumbers.includes(number)
  ) {
    return;
  }


  const already =
    markedNumbers.includes(number);


  try {

    const userId =
      requireUserId();


    const endpoint =
      already
      ? "/api/unmark"
      : "/api/mark";


    const data =
      await api(
        endpoint,
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData(),

            userId:
              userId,

            number:
              number

          })

        }
      );


    if (
      Array.isArray(
        data.markedNumbers
      )
    ) {

      markedNumbers =
        data.markedNumbers.map(Number);

    }


    renderMyBoard();

  } catch (error) {

    showError(
      error.message ||
      "Could not mark number."
    );

  }

}


/* =====================================================
   BINGO
===================================================== */

async function claimBingo() {

  if (!myCardNumber) {

    showError(
      "You have not selected a card."
    );

    return;

  }


  if (
    currentGameStatus !== "playing"
  ) {

    return;

  }


  const button =
    document.getElementById(
      "bingoButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Checking...";


  clearError();


  try {

    const userId =
      requireUserId();


    const data =
      await api(
        "/api/bingo",
        {
          method: "POST",

          body: JSON.stringify({

            initData:
              getInitData(),

            userId:
              userId

          })

        }
      );


    if (
      data.bingo === true
    ) {

      showWinner(
        data.winnerName || "You",
        data.winnerCardNumber || myCardNumber
      );

      return;

    }


    showError(
      data.message ||
      "Bingo is not valid yet."
    );


    button.disabled =
      false;

    button.textContent =
      "🏆 BINGO";

  } catch (error) {

    showError(
      error.message ||
      "Could not check Bingo."
    );


    button.disabled =
      false;

    button.textContent =
      "🏆 BINGO";

  }

}

/* =====================================================

===================================================== */

async function resetForNewGame(gameId) {

    Number(gameId);


  currentGameStatus =
    "playing";


  selectedCardNumber = null;
  selectedBoard = null;

  myCardNumber = null;
  myBoard = null;

  calledNumbers = [];
  markedNumbers = [];

    "currentNumber"
  ).textContent =
    "-";

    "calledHistory"
  ).innerHTML =

    "gameBoard"

/* =====================================================
   GET GAME STATE
===================================================== */

async function getGameState() {

  try {

    return await api(
      `/api/game?_=${Date.now()}`
    );

  } catch (firstError) {

    console.log(
      "/api/game failed, trying /api/game-state",
      firstError
    );


    return await api(
      `/api/game-state?_=${Date.now()}`
    );

  }

}


/* =====================================================
   UPDATE GAME STATE
===================================================== */

async function updateGameState() {

  try {

    const data =
      await getGameState();


    const newGameId =
      Number(
        data.gameId || 0
      );


    /*
     * Detect a new game.
     */

    if (
      currentGameId !== null &&
      newGameId !== Number(currentGameId)
    ) {

      await resetForNewGame(
        newGameId
      );

      return;

    }


    if (
      currentGameId === null
    ) {

      currentGameId =
        newGameId;

    }


    currentGameStatus =
      data.status ||
      "waiting";


    /*
     * Get all called numbers.
     */

    calledNumbers =
      Array.isArray(
        data.calledNumbers
      )
      ? data.calledNumbers
          .map(Number)
          .filter(Number.isFinite)
      : [];


    document.getElementById(
      "gameNumber"
    ).textContent =
      `Game ${newGameId}`;


    document.getElementById(
      "selectionGame"
    ).textContent =
      `Game ${newGameId}`;


    /*
     * IMPORTANT FIX:
     *
     * The server currently gives us:
     *
     * calledNumbers: [55, 56, 30, ...]
     *
     * It does not necessarily give:
     *
     * currentNumber
     *
     * Therefore the latest number in
     * calledNumbers is the current number.
     */

    let currentNumber = null;


    if (
      calledNumbers.length > 0
    ) {

      currentNumber =
        calledNumbers[
          calledNumbers.length - 1
        ];

    }


    /*
     * If server ever sends currentNumber,
     * use it instead.
     */

    if (
      data.currentNumber !== undefined &&
      data.currentNumber !== null &&
      data.currentNumber !== ""
    ) {

      const serverCurrent =
        Number(data.currentNumber);


      if (
        Number.isFinite(serverCurrent)
      ) {

        currentNumber =
          serverCurrent;

      }

    }


    document.getElementById(
      "currentNumber"
    ).textContent =
      currentNumber !== null
      ? currentNumber
      : "-";


    renderCalledHistory();


    /*
     * GAME PLAYING
     */

    if (
      data.status === "playing"
    ) {

      document.getElementById(
        "gameStatus"
      ).textContent =
        "Game is running";


      /*
       * If the user already has a card,
       * keep the game screen open.
       */

      if (
        myCardNumber &&
        myBoard
      ) {

        showScreen(
          "gameScreen"
        );

        renderMyBoard();

      }


      return;

    }


    /*
     * GAME FINISHED
     */

    if (
      data.status === "finished"
    ) {

      const winnerName =
        data.winnerName ||
        (
          data.winner &&
          data.winner.name
        );


      const winnerCard =
        data.winnerCardNumber ||
        (
          data.winner &&
          data.winner.cardNumber
        );


      /*
       * No winner.
       */

      if (
        !winnerName &&
        !winnerCard
      ) {

        if (myCardNumber) {

          showNoWinner();

        }

        return;

      }


      /*
       * We have a winner.
       */

      if (
        myCardNumber &&
        Number(myCardNumber) ===
        Number(winnerCard)
      ) {

        showWinner(
          winnerName,
          winnerCard
        );

      } else if (
        myCardNumber
      ) {

        showGameOver(
          winnerName,
          winnerCard
        );

      }

    }

  } catch (error) {

    console.log(
      "GAME STATE ERROR:",
      error
    );

  }

}


/* =====================================================
   CALLED HISTORY
===================================================== */

function renderCalledHistory() {

  const history =
    document.getElementById(
      "calledHistory"
    );


  history.innerHTML =
    "";


  /*
   * Show newest first.
   */

  [
    ...calledNumbers
  ]
  .reverse()
  .forEach(
    (number, index) => {

      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        number;


      /*
       * Highlight the newest
       * called number.
       */

      if (
        index === 0
      ) {

        span.classList.add(
          "latest"
        );

      }


      history.appendChild(
        span
      );

    }
  );

}


/* =====================================================
   POLLING
===================================================== */

async function poll() {

  try {

    await updateGameState();

  } catch (error) {

    console.log(
      "POLL ERROR:",
      error
    );

  }

}


/* =====================================================
   START
===================================================== */

async function start() {

  if (appStarted) {
    return;
  }


  appStarted =
    true;


  try {

    const userId =
      requireUserId();


    console.log(
      "BINGO TELEGRAM USER ID:",
      userId
    );

  } catch (error) {

    showError(
      error.message
    );

    return;

  }


  /*
   * Get initial game state.
   */

  try {

    const state =
      await getGameState();


    currentGameId =
      Number(
        state.gameId || 0
      );


    currentGameStatus =
      state.status ||
      "waiting";


    /*
     * Immediately load called numbers
     * before loading the card.
     */

    calledNumbers =
      Array.isArray(
        state.calledNumbers
      )
      ? state.calledNumbers.map(Number)
      : [];


    const firstCurrent =
      calledNumbers.length
      ? calledNumbers[
          calledNumbers.length - 1
        ]
      : null;


    document.getElementById(
      "currentNumber"
    ).textContent =
      firstCurrent !== null
      ? firstCurrent
      : "-";


    renderCalledHistory();

  } catch (error) {

    console.log(
      "INITIAL GAME STATE ERROR:",
      error
    );

  }


  /*
   * Check existing card.
   */

  await loadMyCard();


  /*
   * Immediately synchronize again.
   */

  await updateGameState();


  /*
   * Poll every second.
   */

  if (!gamePolling) {

    gamePolling =
      setInterval(
        poll,
        1000
      );

  }

}

/* =====================================================
   START APP
===================================================== */

start();
