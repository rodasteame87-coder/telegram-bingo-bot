<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bingo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2edff;
      color: #241b35;
    }

    .page {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 18px;
      color: #5d35a8;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .hidden {
      display: none !important;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 15px;
    }

    #cardList {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .card-choice {
      border: 0;
      border-radius: 12px;
      padding: 13px 5px;
      font-size: 16px;
      font-weight: bold;
      background: #e8e0ff;
      color: #4d287f;
      cursor: pointer;
    }

    .card-choice.selected {
      background: #7040c5;
      color: white;
    }

    .card-choice.used {
      background: #ccc;
      color: #777;
      cursor: not-allowed;
    }

    #previewBoard,
    #gameBoard {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-top: 12px;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #eee9fa;
      font-weight: bold;
      font-size: clamp(14px, 4vw, 20px);
    }

    .header-cell {
      background: #7040c5;
      color: white;
    }

    .free {
      background: #8c61d1;
      color: white;
    }

    .marked {
      background: #39a852 !important;
      color: white;
    }

    button.action {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      background: #7040c5;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button.action:disabled {
      background: #bbb;
    }

    .game-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info {
      background: #f1ebff;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .info small {
      display: block;
      color: #777;
    }

    .info strong {
      font-size: 20px;
    }

    .current-call {
      text-align: center;
      background: #7040c5;
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin: 15px 0;
    }

    .current-call small {
      display: block;
      opacity: .8;
    }

    .current-number {
      font-size: 42px;
      font-weight: bold;
      margin-top: 5px;
    }

    #calledNumbers {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .called {
      background: #e8e0ff;
      border-radius: 8px;
      padding: 7px 9px;
      font-weight: bold;
    }

    .winner {
      background: #e7f7e9;
      border: 2px solid #39a852;
      color: #20732e;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      margin-bottom: 15px;
    }

    .winner-number {
      font-size: 30px;
      font-weight: bold;
    }

    .game-over {
      background: #fff0f0;
      border: 2px solid #e05a5a;
      color: #a52d2d;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .game-over h2 {
      margin: 0 0 8px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    @media (max-width: 400px) {
      .page {
        padding: 10px;
      }

      #cardList {
        gap: 5px;
      }

      .card-choice {
        padding: 11px 3px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- CARD SELECTION -->
  <section id="selectionScreen" class="panel">
    <h1>🎱 BINGO</h1>

    <div class="title">Choose Your Card</div>
    <div class="subtitle">Choose one number from 1–100</div>

    <div id="selectionMessage" class="subtitle"></div>

    <div id="cardList"></div>

    <div id="previewSection" class="hidden">
      <div class="title" style="margin-top:20px;">
        Card #<span id="previewNumber"></span>
      </div>

      <div id="previewBoard"></div>

      <button id="confirmButton" class="action">
        OK — Choose This Card
      </button>
    </div>
  </section>


  <!-- GAME -->
  <section id="gameScreen" class="hidden">

    <div class="panel">

      <div class="title">🎱 BINGO GAME</div>

      <div class="game-info">
        <div class="info">
          <small>Game</small>
          <strong id="gameId">-</strong>
        </div>

        <div class="info">
          <small>Status</small>
          <strong id="gameStatus">-</strong>
        </div>
      </div>

      <div id="winnerBox" class="winner hidden">
        <div>🏆 WINNER</div>
        <div id="winnerName" style="font-size:22px;font-weight:bold;"></div>
        <div style="margin-top:8px;">Winning Card</div>
        <div class="winner-number">
          #<span id="winnerCard"></span>
        </div>
      </div>

      <div id="gameOverBox" class="game-over hidden">
        <h2>GAME OVER</h2>
        <div>Better luck next time!</div>
        <div style="margin-top:12px;">
          Returning to card selection...
        </div>
      </div>

      <div class="current-call">
        <small>Current Number</small>
        <div id="currentNumber" class="current-number">—</div>
      </div>

      <div>
        <strong>Called Numbers</strong>
        <div id="calledNumbers"></div>
      </div>

      <div class="title" style="margin-top:20px;">
        Your Card #<span id="myCardNumber">-</span>
      </div>

      <div id="gameBoard"></div>

      <button id="bingoButton" class="action">
        🎉 BINGO!
      </button>

    </div>
  </section>

  <div id="loading" class="loading hidden">
    Loading...
  </div>

</div>


<script>
(function () {

  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const initData = tg ? tg.initData : "";

  let cards = {};
  let selectedCard = null;
  let myCard = null;

  let currentGameId = null;
  let calledNumbers = [];
  let markedNumbers = [];

  let gamePolling = null;
  let returnTimer = null;


  const selectionScreen = document.getElementById("selectionScreen");
  const gameScreen = document.getElementById("gameScreen");

  const cardList = document.getElementById("cardList");
  const previewSection = document.getElementById("previewSection");
  const previewBoard = document.getElementById("previewBoard");
  const previewNumber = document.getElementById("previewNumber");
  const confirmButton = document.getElementById("confirmButton");
  const selectionMessage = document.getElementById("selectionMessage");

  const gameIdEl = document.getElementById("gameId");
  const gameStatusEl = document.getElementById("gameStatus");
  const currentNumberEl = document.getElementById("currentNumber");
  const calledNumbersEl = document.getElementById("calledNumbers");
  const gameBoard = document.getElementById("gameBoard");
  const myCardNumberEl = document.getElementById("myCardNumber");

  const bingoButton = document.getElementById("bingoButton");

  const winnerBox = document.getElementById("winnerBox");
  const winnerName = document.getElementById("winnerName");
  const winnerCard = document.getElementById("winnerCard");

  const gameOverBox = document.getElementById("gameOverBox");


  function showSelection() {
    selectionScreen.classList.remove("hidden");
    gameScreen.classList.add("hidden");

    winnerBox.classList.add("hidden");
    gameOverBox.classList.add("hidden");

    selectedCard = null;
    previewSection.classList.add("hidden");
  }


  function showGame() {
    selectionScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
  }


  function boardArray(board) {
    if (Array.isArray(board)) return board;

    try {
      return JSON.parse(board);
    } catch (e) {
      return [];
    }
  }


  function renderBoard(container, board, marks, clickable) {

    container.innerHTML = "";

    const b = boardArray(board);
    const marked = new Set((marks || []).map(Number));

    if (!Array.isArray(b) || b.length !== 5) {
      container.innerHTML =
        "<div style='grid-column:1/-1;text-align:center'>Board unavailable</div>";
      return;
    }

    const letters = ["B", "I", "N", "G", "O"];

    letters.forEach(letter => {
      const cell = document.createElement("div");
      cell.className = "cell header-cell";
      cell.textContent = letter;
      container.appendChild(cell);
    });

    for (let r = 0; r < 5; r++) {

      for (let c = 0; c < 5; c++) {

        const value = b[r][c];

        const cell = document.createElement("div");
        cell.className = "cell";

        if (r === 2 && c === 2) {
          cell.textContent = "FREE";
          cell.classList.add("free");
          container.appendChild(cell);
          continue;
        }

        cell.textContent = value;

        if (marked.has(Number(value))) {
          cell.classList.add("marked");
        }

        if (clickable) {

          const isCalled =
            calledNumbers.includes(Number(value));

          if (isCalled) {
            cell.style.cursor = "pointer";

            cell.addEventListener("click", async function () {

              if (marked.has(Number(value))) {
                await unmarkNumber(Number(value));
              } else {
                await markNumber(Number(value));
              }

            });
          } else {
            cell.style.opacity = "0.55";
          }
        }

        container.appendChild(cell);
      }
    }
  }


  async function loadCards() {

    try {

      const response = await fetch("/api/cards");
      const data = await response.json();

      cards = data.cards || {};

      renderCardChoices(data.usedCards || []);

    } catch (error) {

      selectionMessage.textContent =
        "Unable to load cards. Please try again.";

      console.error(error);
    }
  }


  function renderCardChoices(usedCards) {

    cardList.innerHTML = "";

    const used = new Set((usedCards || []).map(Number));

    for (let i = 1; i <= 100; i++) {

      const button = document.createElement("button");

      button.className = "card-choice";
      button.textContent = i;
      button.type = "button";

      if (used.has(i)) {
        button.classList.add("used");
        button.disabled = true;
      }

      button.addEventListener("click", function () {

        selectedCard = i;

        document
          .querySelectorAll(".card-choice")
          .forEach(x => x.classList.remove("selected"));

        button.classList.add("selected");

        previewNumber.textContent = i;

        previewSection.classList.remove("hidden");

        renderBoard(
          previewBoard,
          cards[String(i)] || cards[i],
          [],
          false
        );

        previewSection.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      });

      cardList.appendChild(button);
    }
  }


  confirmButton.addEventListener("click", async function () {

    if (!selectedCard) return;

    confirmButton.disabled = true;
    confirmButton.textContent = "Choosing...";

    try {

      const response = await fetch("/api/select-card", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: initData,
          cardNumber: selectedCard
        })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {

        selectionMessage.textContent =
          data.message || "This card is already taken.";

        confirmButton.disabled = false;
        confirmButton.textContent = "OK — Choose This Card";

        await loadCards();
        return;
      }

      myCard = data.card;
      markedNumbers = [];

      await loadMyCard();

      showGame();

      await updateGameState();

    } catch (error) {

      selectionMessage.textContent =
        "Could not choose the card.";

      confirmButton.disabled = false;
      confirmButton.textContent = "OK — Choose This Card";
    }

  });


  async function loadMyCard() {

    try {

      const response = await fetch(
        "/api/my-card?initData=" +
        encodeURIComponent(initData)
      );

      const data = await response.json();

      if (data.cardNumber) {
        myCardNumberEl.textContent = data.cardNumber;
        myCard = data.card;
        markedNumbers = data.markedNumbers || [];
      }

    } catch (error) {
      console.error(error);
    }
  }


  function resetForNewGame(newGameId) {

    currentGameId = newGameId;

    calledNumbers = [];
    markedNumbers = [];

    currentNumberEl.textContent = "—";
    calledNumbersEl.innerHTML = "";

    winnerBox.classList.add("hidden");
    gameOverBox.classList.add("hidden");

    bingoButton.disabled = false;

    if (myCard) {
      renderBoard(
        gameBoard,
        myCard,
        markedNumbers,
        true
      );
    }
  }


  async function updateGameState() {

    try {

      const response = await fetch("/api/game-state");
      const state = await response.json();

      const newGameId = Number(state.gameId);

      /*
       * IMPORTANT:
       * When the server starts a new game, the old green marks,
       * called numbers and winner screen are completely cleared.
       */
      if (
        currentGameId !== null &&
        newGameId !== currentGameId
      ) {

        resetForNewGame(newGameId);

        /*
         * The player's previous card has been released by the
         * server. Return to choosing 1–100.
         */
        setTimeout(async function () {
          showSelection();
          await loadCards();
          await loadMyCard();
        }, 300);

        return;
      }

      if (currentGameId === null) {
        currentGameId = newGameId;
      }

      gameIdEl.textContent = newGameId;
      gameStatusEl.textContent =
        String(state.status || "").toUpperCase();

      calledNumbers =
        (state.calledNumbers || []).map(Number);

      currentNumberEl.textContent =
        state.currentNumber || "—";

      calledNumbersEl.innerHTML = "";

      calledNumbers.slice().reverse().forEach(number => {

        const item = document.createElement("span");

        item.className = "called";
        item.textContent = number;

        calledNumbersEl.appendChild(item);
      });


      if (state.status === "finished") {

        bingoButton.disabled = true;

        winnerBox.classList.remove("hidden");

        winnerName.textContent =
          state.winnerName || "Winner";

        winnerCard.textContent =
          state.winnerCardNumber || "?";

        gameOverBox.classList.remove("hidden");

        return;
      }


      gameOverBox.classList.add("hidden");
      winnerBox.classList.add("hidden");

      bingoButton.disabled = false;

      if (myCard) {
        renderBoard(
          gameBoard,
          myCard,
          markedNumbers,
          true
        );
      }

    } catch (error) {
      console.error("Game state error:", error);
    }
  }


  async function markNumber(number) {

    try {

      const response = await fetch("/api/mark", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: initData,
          number: number
        })
      });

      const data = await response.json();

      if (data.success) {
        markedNumbers = data.markedNumbers || [];
        renderBoard(gameBoard, myCard, markedNumbers, true);
      }

    } catch (error) {
      console.error(error);
    }
  }


  async function unmarkNumber(number) {

    try {

      const response = await fetch("/api/unmark", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: initData,
          number: number
        })
      });

      const data = await response.json();

      if (data.success) {
        markedNumbers = data.markedNumbers || [];
        renderBoard(gameBoard, myCard, markedNumbers, true);
      }

    } catch (error) {
      console.error(error);
    }
  }


  bingoButton.addEventListener("click", async function () {

    bingoButton.disabled = true;
    bingoButton.textContent = "Checking...";

    try {

      const response = await fetch("/api/bingo", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          initData: initData
        })
      });

      const data = await response.json();

      if (data.bingo) {

        winnerBox.classList.remove("hidden");

        winnerName.textContent =
          data.winnerName || "You";

        winnerCard.textContent =
          data.winnerCardNumber ||
          myCardNumberEl.textContent;

        gameStatusEl.textContent = "FINISHED";

        bingoButton.textContent = "🏆 BINGO VALID!";

      } else {

        alert(
          data.message ||
          "Bingo is not valid yet."
        );

        bingoButton.disabled = false;
        bingoButton.textContent = "🎉 BINGO!";
      }

    } catch (error) {

      bingoButton.disabled = false;
      bingoButton.textContent = "🎉 BINGO!";
    }

  });


  async function start() {

    if (!initData) {
      selectionMessage.textContent =
        "Please open this game from Telegram.";
    }

    await loadCards();

    await loadMyCard();

    /*
     * If the player already has a card in the current game,
     * show the game directly.
     */
    if (myCard) {
      showGame();
      await updateGameState();
    } else {
      showSelection();
    }

    /*
     * Check frequently so a new game is detected quickly.
     */
    gamePolling = setInterval(
      updateGameState,
      1000
    );
  }


  start();

})();
</script>

</body>
</html>
