.preview-title {

  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

  border-spacing: 4px;
}

.bingo-board th {

}

  text-align: center;

  font-size: 16px;

}

.free {

}

.button-row {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

button.main-button {
  flex: 1;

  border-radius: 10px;
  padding: 14px;

  font-weight: bold;

}

.ok-button {

  color: white;
}

.back-button {
  background: #4b5563;

}

.called-box {
  background: #1f2937;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  margin-bottom: 14px;
}

.called-label {
  color: #9ca3af;
  font-size: 14px;
}

.current-number {
  font-size: 48px;
  font-weight: bold;
  margin: 5px 0;
}

.called-history {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  max-height: 100px;
  overflow-y: auto;
}

.called-history span {
  background: #2563eb;
  border-radius: 7px;
  padding: 5px 8px;

}

.my-card-title {
  text-align: center;
  margin: 12px 0;
  font-size: 20px;
  font-weight: bold;
}

.play-board td {
  cursor: pointer;
  user-select: none;
}

.play-board td.called {
  background: #2563eb;
}

.play-board td.marked {
  background: #16a34a;
}

.play-board td.free {
  background: #16a34a !important;
}

.bingo-button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  margin-top: 15px;
  background: #dc2626;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

.bingo-button:disabled {
  opacity: 0.6;
}

.result-box {
  border-radius: 14px;
  padding: 20px;
  margin-top: 15px;
  text-align: center;
}

.winner-box {
  background: #14532d;
}

.gameover-box {
  background: #7f1d1d;
}

.result-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 10px;
}

.result-text {
  font-size: 17px;
  line-height: 1.5;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #9ca3af;
}

.error {
  background: #7f1d1d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}

.success {
  background: #14532d;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
}
</style>
</head>

</div>

<div class="game-info">

Game
</div>

</div>

</div>

</div>
</div>

</div>

id="previewBox"
class="preview-box"
style="display:none;"
>

<div
class="preview-title"
id="previewTitle"
>
Card
</div>

<button
class="main-button back-button"
id="backButton"
>
Back
</button>

<button
class="main-button ok-button"
id="confirmButton"
>
OK
</button>

<h1>🎱 BINGO</h1>

<div class="game-info">

<div
class="game-number"
id="gameNumber"
>
Game
</div>

<div
class="game-status"
id="gameStatus"
>
Game is running
</div>

</div>

<div class="called-label">
CURRENT NUMBER
</div>

class="current-number"
id="currentNumber"
>
-
</div>

Called numbers
</div>

class="called-history"
id="calledHistory"

</div>

class="my-card-title"
id="myCardTitle"

<button
id="bingoButton"
class="bingo-button"
>
🏆 BINGO
</button>

<script>

const tg =
window.Telegram &&
window.Telegram.WebApp
? window.Telegram.WebApp
: null;

if (tg) {
tg.ready();
tg.expand();
}


let selectedCardNumber = null;
let selectedBoard = null;

let myCardNumber = null;
let myBoard = null;

let calledNumbers = [];
let markedNumbers = [];

let currentGameId = null;
let currentGameStatus = "waiting";

let pollTimer = null;
let appStarted = false;


/* =====================
   INIT DATA
===================== */

function getInitData() {

if (!tg) {
return "";
}

return tg.initData || "";

}


/* =====================
   API
===================== */

async function api(url, options = {}) {

const requestOptions = {
...options,
cache: "no-store",
headers: {
...(options.headers || {}),
"Content-Type": "application/json",
"Cache-Control": "no-cache"
}
};

const response =
await fetch(url, requestOptions);

let data;

try {

data = await response.json();

} catch {

throw new Error(
"Invalid server response."
);

}

if (!response.ok) {

throw new Error(
data.message ||
data.error ||
`Server error ${response.status}`
);

}

return data;

}


/* =====================
   HELPERS
===================== */

function escapeHtml(value) {

return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


function showError(message) {

document.getElementById(
"errorBox"
).innerHTML = `
<div class="error">
${escapeHtml(message)}
</div>
`;

}


function clearError() {

document.getElementById(
"errorBox"
).innerHTML = "";

}


function showScreen(id) {

document
.querySelectorAll(".screen")
.forEach(
screen =>
screen.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

}


/* =====================
   BOARD NORMALIZER
===================== */

function normalizeBoard(board) {

if (!board) {
return null;
}


/*
 * Sometimes JSON can arrive as a
 * JSON string. Try to decode it.
 */

if (typeof board === "string") {

try {

board = JSON.parse(board);

} catch {

return null;

}

}


if (!Array.isArray(board)) {
return null;
}

if (board.length !== 5) {
return null;
}

for (let r = 0; r < 5; r++) {

if (
!Array.isArray(board[r]) ||
board[r].length !== 5
) {

return null;

}

}

return board;

}


/* =====================
   FIND CARD BOARD
===================== */

function findCardBoard(cards, number) {

const n = String(number);

if (!cards) {
return null;
}


/*
 * Object format:
 *
 * {
 *   "1": [[...]],
 *   "2": [[...]]
 * }
 */

if (
typeof cards === "object" &&
!Array.isArray(cards)
) {

let item =
cards[n];

if (!item) {
item = cards[number];
}

if (!item) {
return null;
}


/*
 * Direct board
 */

let board =
normalizeBoard(item);

if (board) {
return board;
}


/*
 * Object containing board
 */

if (
typeof item === "object"
) {

board =
normalizeBoard(item.board);

if (board) {
return board;
}

board =
normalizeBoard(item.card);

if (board) {
return board;
}

}

}


/*
 * Array format.
 */

if (Array.isArray(cards)) {

const item =
cards.find(
x =>
Number(
x.card_number ??
x.cardNumber ??
x.number
) === Number(number)
);

if (!item) {
return null;
}

return normalizeBoard(
item.board ??
item.card
);

}

return null;

}


/* =====================
   LOAD CARDS
===================== */

async function loadCards() {

clearError();

const grid =
document.getElementById(
"cardsGrid"
);

grid.innerHTML = `
<div class="loading">
Loading cards...
</div>
`;

try {

const data =
await api(
`/api/cards?_=${Date.now()}`
);


const gameId =
Number(data.gameId || 0);

currentGameId =
gameId;


document.getElementById(
"selectionGame"
).textContent =
`Game ${gameId}`;


document.getElementById(
"selectionStatus"
).textContent =
data.status === "playing"
? "Choose one available card from 1–100"
: "Waiting for the next game...";


const usedCards =
Array.isArray(data.usedCards)
? data.usedCards.map(Number)
: [];


grid.innerHTML = "";


/*
 * Always create all 100 buttons.
 */

for (
let number = 1;
number <= 100;
number++
) {

const button =
document.createElement("button");

button.className =
"card-number";

button.textContent =
number;


if (
usedCards.includes(number)
) {

button.classList.add(
"unavailable"
);

button.disabled = true;

} else {

button.addEventListener(
"click",
function() {
previewCard(number);
}
);

}

grid.appendChild(button);

}

} catch (error) {

console.error(
"LOAD CARDS ERROR:",
error
);

grid.innerHTML = "";

showError(
error.message ||
"Could not load cards."
);


/*
 * Still display 1–100 so the
 * interface does not disappear.
 */

for (
let number = 1;
number <= 100;
number++
) {

const button =
document.createElement("button");

button.className =
"card-number";

button.textContent =
number;

button.addEventListener(
"click",
function() {
previewCard(number);
}
);

grid.appendChild(button);

}

}

}


/* =====================
   PREVIEW CARD
===================== */

async function previewCard(number) {

clearError();

selectedCardNumber = null;
selectedBoard = null;

try {

const data =
await api(
`/api/cards?_=${Date.now()}`
);


console.log(
"Cards response:",
data
);


const board =
findCardBoard(
data.cards,
number
);


if (!board) {

console.error(
"Board missing for card:",
number,
"Cards:",
data.cards
);

throw new Error(
`Card #${number} board could not be loaded.`
);

}


const usedCards =
Array.isArray(data.usedCards)
? data.usedCards.map(Number)
: [];


if (
usedCards.includes(Number(number))
) {

const owner =
data.usedBy &&
data.usedBy[String(number)];

throw new Error(
owner && owner.name
? `Card #${number} is already taken by ${owner.name}.`
: `Card #${number} is already taken.`
);

}


selectedCardNumber =
Number(number);

selectedBoard =
board;


document.getElementById(
"previewTitle"
).textContent =
`Card #${number}`;


document.getElementById(
"previewBoard"
).innerHTML =
createBoardHtml(
board,
false
);


document.getElementById(
"previewBox"
).style.display =
"block";


document.getElementById(
"previewBox"
).scrollIntoView({
behavior: "smooth",
block: "start"
});

} catch (error) {

console.error(
"PREVIEW CARD ERROR:",
error
);

showError(
error.message ||
"Could not load Bingo card."
);

}

}


/* =====================
   CANCEL
===================== */

function cancelSelection() {

selectedCardNumber = null;
selectedBoard = null;

document.getElementById(
"previewBox"
).style.display =
"none";

clearError();

}


/* =====================
   CONFIRM CARD
===================== */

async function confirmCard() {

if (
!selectedCardNumber
) {

showError(
"Please choose a card first."
);

return;

}


const number =
Number(selectedCardNumber);

const button =
document.getElementById(
"confirmButton"
);

button.disabled = true;
button.textContent = "Selecting...";

clearError();

try {

const data =
await api(
"/api/select-card",
{
method: "POST",
body: JSON.stringify({

initData:
getInitData(),

cardNumber:
number

})
}
);


console.log(
"SELECT CARD RESPONSE:",
data
);


if (
data.success !== true
) {

throw new Error(
data.message ||
"Could not select this card."
);

}


const serverBoard =
normalizeBoard(
data.board
) ||
normalizeBoard(
data.card
);


const fallbackBoard =
normalizeBoard(
selectedBoard
);


myCardNumber =
Number(
data.cardNumber ||
number
);


myBoard =
serverBoard ||
fallbackBoard;


if (!myBoard) {

throw new Error(
"The server selected the card, but no Bingo board was returned."
);

}


currentGameId =
Number(
data.gameId ||
currentGameId ||
0
);

markedNumbers = [];
calledNumbers = [];

selectedCardNumber = null;
selectedBoard = null;

document.getElementById(
"previewBox"
).style.display =
"none";

document.getElementById(
"resultArea"
).innerHTML =
"";

document.getElementById(
"bingoButton"
).style.display =
"block";

document.getElementById(
"bingoButton"
).disabled =
false;

document.getElementById(
"bingoButton"
).textContent =
"🏆 BINGO";

showScreen(
"gameScreen"
);

renderMyBoard();

await updateGameState();

} catch (error) {

console.error(
"CONFIRM CARD ERROR:",
error
);

showError(
error.message ||
"Could not select Bingo card."
);

await loadCards();

} finally {

button.disabled = false;
button.textContent = "OK";

}

}


/* =====================
   LOAD MY CARD
===================== */

async function loadMyCard() {

try {

const data =
await api(
`/api/my-card?initData=${encodeURIComponent(
getInitData()
)}&_=${Date.now()}`
);


console.log(
"MY CARD RESPONSE:",
data
);


if (
!data ||
!data.cardNumber
) {

myCardNumber = null;
myBoard = null;
markedNumbers = [];

showScreen(
"selectionScreen"
);

await loadCards();

return;

}


const board =
normalizeBoard(data.board) ||
normalizeBoard(data.card);


if (!board) {

console.error(
"MY CARD HAS NO BOARD:",
data
);

myCardNumber = null;
myBoard = null;
markedNumbers = [];

showScreen(
"selectionScreen"
);

await loadCards();

return;

}


myCardNumber =
Number(data.cardNumber);

myBoard =
board;

markedNumbers =
Array.isArray(data.markedNumbers)
? data.markedNumbers.map(Number)
: [];

currentGameId =
Number(
data.gameId ||
currentGameId ||
0
);

showScreen(
"gameScreen"
);

renderMyBoard();

} catch (error) {

console.error(
"LOAD MY CARD ERROR:",
error
);

myCardNumber = null;
myBoard = null;
markedNumbers = [];

showScreen(
"selectionScreen"
);

await loadCards();

}

}


/* =====================
   BOARD HTML
===================== */

function createBoardHtml(
board,
playable
) {

board =
normalizeBoard(board);

if (!board) {

return `
<div class="error">
Could not display Bingo board.
</div>
`;

}


let html = `
<table class="bingo-board ${
playable ? "play-board" : ""
}">
<thead>
<tr>
<th>B</th>
<th>I</th>
<th>N</th>
<th>G</th>
<th>O</th>
</tr>
</thead>
<tbody>
`;


for (
let row = 0;
row < 5;
row++
) {

html += "<tr>";

for (
let col = 0;
col < 5;
col++
) {

const value =
board[row][col];

const free =
row === 2 &&
col === 2;

const numeric =
Number(value);

let classes = "";

if (free) {

classes += " free";

}

if (
playable &&
!free &&
Number.isFinite(numeric) &&
markedNumbers.includes(numeric)
) {

classes += " marked";

} else if (
playable &&
!free &&
Number.isFinite(numeric) &&
calledNumbers.includes(numeric)
) {

classes += " called";

}


let click = "";

if (
playable &&
!free &&
Number.isFinite(numeric)
) {

click =
`onclick="toggleMark(${numeric})"`;

}


html += `
<td
class="${classes.trim()}"
${click}
>
${free ? "FREE" : escapeHtml(value)}
</td>
`;

}

html += "</tr>";

}

html += `
</tbody>
</table>
`;

return html;

}


/* =====================
   RENDER BOARD
===================== */

function renderMyBoard() {

if (!myBoard) {
return;
}

document.getElementById(
"myCardTitle"
).textContent =
`My Card #${myCardNumber}`;

document.getElementById(
"gameBoard"
).innerHTML =
createBoardHtml(
myBoard,
true
);

}


/* =====================
   MARK
===================== */

async function toggleMark(number) {

number = Number(number);

if (
currentGameStatus !== "playing"
) {
return;
}

if (
!calledNumbers.includes(number)
) {
return;
}


const already =
markedNumbers.includes(number);


try {

const endpoint =
already
? "/api/unmark"
: "/api/mark";


const data =
await api(
endpoint,
{
method: "POST",
body: JSON.stringify({

initData:
getInitData(),

number

})
}
);


if (
Array.isArray(
data.markedNumbers
)
) {

markedNumbers =
data.markedNumbers.map(Number);

}

renderMyBoard();

} catch (error) {

showError(
error.message ||
"Could not mark number."
);

}

}


/* =====================
   BINGO
===================== */

async function claimBingo() {

if (!myCardNumber) {

showError(
"You have not selected a card."
);

return;

}

if (
currentGameStatus !== "playing"
) {
return;
}


const button =
document.getElementById(
"bingoButton"
);

button.disabled = true;
button.textContent = "Checking...";

clearError();

try {

const data =
await api(
"/api/bingo",
{
method: "POST",
body: JSON.stringify({
initData:
getInitData()
})
}
);


if (
data.bingo === true
) {

showWinner(
data.winnerName || "You",
data.winnerCardNumber ||
myCardNumber
);

return;

}


showError(
data.message ||
"Bingo is not valid yet."
);

button.disabled = false;
button.textContent = "🏆 BINGO";

} catch (error) {

showError(
error.message ||
"Could not check Bingo."
);

button.disabled = false;
button.textContent = "🏆 BINGO";

}

}


/* =====================
   WINNER
===================== */

function showWinner(
name,
cardNumber
) {

currentGameStatus =
"finished";

document.getElementById(
"gameStatus"
).textContent =
"Game finished";

document.getElementById(
"resultArea"
).innerHTML = `
<div class="result-box winner-box">

<div class="result-title">
🏆 BINGO!
</div>

<div class="result-text">

Winner:
<strong>
${escapeHtml(name)}
</strong>

<br>

Winning Card:
<strong>
#${escapeHtml(cardNumber)}
</strong>

<br><br>

🎉 Congratulations!

</div>

</div>
`;

document.getElementById(
"bingoButton"
).style.display =
"none";

}


/* =====================
   GAME OVER
===================== */

function showGameOver(
name,
cardNumber
) {

currentGameStatus =
"finished";

document.getElementById(
"gameStatus"
).textContent =
"Game finished";

document.getElementById(
"resultArea"
).innerHTML = `
<div class="result-box gameover-box">

<div class="result-title">
GAME OVER
</div>

<div class="result-text">

Winner:
<strong>
${escapeHtml(name)}
</strong>

<br>

Winning Card:
<strong>
#${escapeHtml(cardNumber)}
</strong>

<br><br>

Better luck next time! 🍀

</div>

</div>
`;

document.getElementById(
"bingoButton"
).style.display =
"none";

}


/* =====================
   RESET NEW GAME
===================== */

async function resetForNewGame(
gameId
) {

currentGameId =
Number(gameId);

currentGameStatus =
"playing";

selectedCardNumber = null;
selectedBoard = null;

myCardNumber = null;
myBoard = null;

calledNumbers = [];
markedNumbers = [];

document.getElementById(
"currentNumber"
).textContent = "-";

document.getElementById(
"calledHistory"

/* =====================
   GAME STATE
===================== */

async function updateGameState() {

try {

const data =
await api(
`/api/game-state?_=${Date.now()}`
);


const newGameId =
Number(data.gameId || 0);


if (
currentGameId === null
) {

currentGameId =
newGameId;

}


if (
Number(newGameId) !==
Number(currentGameId)
) {

await resetForNewGame(
newGameId
);

return;

}


currentGameStatus =
data.status ||
"waiting";


calledNumbers =
Array.isArray(
data.calledNumbers
)
? data.calledNumbers.map(Number)
: [];


document.getElementById(
"gameNumber"
).textContent =
`Game ${newGameId}`;

document.getElementById(
"selectionGame"
).textContent =
`Game ${newGameId}`;


document.getElementById(
"currentNumber"
).textContent =
data.currentNumber
? Number(data.currentNumber)
: "-";


renderCalledHistory();


if (
data.status === "playing"
) {

document.getElementById(
"gameStatus"
).textContent =
"Game is running";

if (
myCardNumber &&
myBoard
) {

showScreen(
"gameScreen"
);

renderMyBoard();

}

return;

}


if (
data.status === "finished"
) {

const winnerName =
data.winnerName ||
"Another player";

const winnerCard =
data.winnerCardNumber ||
"?";


if (
myCardNumber &&
Number(myCardNumber) ===
Number(winnerCard)
) {

showWinner(
winnerName,
winnerCard
);

} else {

showGameOver(
winnerName,
winnerCard
);

}

}

} catch (error) {

console.log(
"GAME STATE ERROR:",
error
);

}

}


/* =====================
   HISTORY
===================== */

function renderCalledHistory() {

const history =
document.getElementById(
"calledHistory"
);

history.innerHTML = "";

[
...calledNumbers
].reverse().forEach(
number => {

const span =
document.createElement(
"span"
);

span.textContent =
number;

history.appendChild(
span
);

}
);

}


/* =====================
   POLLING
===================== */

async function poll() {

await updateGameState();

}


/* =====================
   START
===================== */

async function start() {

if (appStarted) {
return;
}

appStarted = true;


try {

const state =
await api(
`/api/game-state?_=${Date.now()}`
);

currentGameId =
Number(
state.gameId || 0
);

currentGameStatus =
state.status ||
"waiting";

} catch (error) {

console.error(
"INITIAL STATE ERROR:",
error
);

}


await loadMyCard();

await updateGameState();


pollTimer =
setInterval(
poll,
1000
);

}


/* =====================
   BUTTONS
===================== */

document.getElementById(
"backButton"
).addEventListener(
"click",
cancelSelection
);

document.getElementById(
"confirmButton"
).addEventListener(
"click",
confirmCard
);

document.getElementById(
"bingoButton"
).addEventListener(
"click",
claimBingo
);


/* =====================
   START APP
===================== */

start();

</script>
