<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #222;
      text-align: center;
    }

    .top {
      max-width: 430px;
      margin: auto;
    }

    h1 {
      margin: 5px 0;
      font-size: 32px;
    }

    #playerName {
      font-size: 17px;
      margin-bottom: 12px;
      color: #555;
    }

    .last-called {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .last-title {
      font-size: 14px;
      font-weight: bold;
      color: #777;
      margin-bottom: 5px;
    }

    #latest {
      font-size: 42px;
      font-weight: bold;
      color: #e53935;
    }

    #counter {
      margin-top: 5px;
      font-size: 15px;
      color: #666;
    }

    #status {
      margin: 10px 0;
      font-weight: bold;
    }

    .board {
      max-width: 430px;
      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 6px;
    }

    .header {
      background: #222;
      color: white;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 19px;
      font-weight: bold;
    }

    .cell {
      background: white;
      border-radius: 9px;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;

      box-shadow:
        0 2px 5px rgba(0,0,0,0.12);

      cursor: pointer;
      user-select: none;
    }

    /* Called number = WHITE */
    .cell.called {
      background: white;
      color: #222;
      border: 2px solid #35c759;
    }

    /* Player mark = GREEN */
    .cell.marked {
      background: #35c759;
      color: white;
      border: 2px solid #35c759;
    }

    /* FREE space = YELLOW */
    .cell.free {
      background: #ffcc00;
      color: #111;
      border: 2px solid #ffcc00;
    }

    .called-box {
      max-width: 430px;
      margin: 15px auto;

      background: white;

      border-radius: 15px;

      padding: 12px;

      box-shadow:
        0 3px 10px rgba(0,0,0,0.10);
    }

    .called-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .number {
      display: inline-block;

      margin: 3px;

      padding: 6px 8px;

      border-radius: 7px;

      background: #e5e7eb;

      font-size: 13px;
      font-weight: bold;
    }

    button {
      width: 100%;
      max-width: 430px;

      margin-top: 5px;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #e53935;

      color: white;

      font-size: 21px;

      font-weight: bold;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.15);
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      max-width: 430px;

      margin: 15px auto;

      font-size: 18px;

      font-weight: bold;
    }

    .help {
      max-width: 430px;

      margin: 15px auto 5px;

      font-size: 13px;

      color: #777;
    }

  </style>
</head>

<body>

  <div class="top">

    <h1>🎱 BINGO</h1>

    <div id="playerName">
      Loading player...
    </div>

    <div class="last-called">

      <div class="last-title">
        🔔 LAST CALLED
      </div>

      <div id="latest">
        --
      </div>

      <div id="counter">
        0/75 numbers called
      </div>

    </div>

    <div id="status">
      🔄 Loading game...
    </div>

  </div>


  <div class="board">

    <div class="header">B</div>
    <div class="header">I</div>
    <div class="header">N</div>
    <div class="header">G</div>
    <div class="header">O</div>

    <div id="cell-0-0" class="cell"></div>
    <div id="cell-0-1" class="cell"></div>
    <div id="cell-0-2" class="cell"></div>
    <div id="cell-0-3" class="cell"></div>
    <div id="cell-0-4" class="cell"></div>

    <div id="cell-1-0" class="cell"></div>
    <div id="cell-1-1" class="cell"></div>
    <div id="cell-1-2" class="cell"></div>
    <div id="cell-1-3" class="cell"></div>
    <div id="cell-1-4" class="cell"></div>

    <div id="cell-2-0" class="cell"></div>
    <div id="cell-2-1" class="cell"></div>
    <div id="cell-2-2" class="cell"></div>
    <div id="cell-2-3" class="cell"></div>
    <div id="cell-2-4" class="cell"></div>

    <div id="cell-3-0" class="cell"></div>
    <div id="cell-3-1" class="cell"></div>
    <div id="cell-3-2" class="cell"></div>
    <div id="cell-3-3" class="cell"></div>
    <div id="cell-3-4" class="cell"></div>

    <div id="cell-4-0" class="cell"></div>
    <div id="cell-4-1" class="cell"></div>
    <div id="cell-4-2" class="cell"></div>
    <div id="cell-4-3" class="cell"></div>
    <div id="cell-4-4" class="cell"></div>

  </div>


  <div class="called-box">

    <div class="called-title">
      📢 CALLED NUMBERS
    </div>

    <div id="calledNumbers">
      No numbers yet
    </div>

  </div>


  <button onclick="claimBingo()">
    🏆 BINGO!
  </button>


  <div id="message"></div>


  <div class="help">
    ⚪ Called &nbsp; 🟢 Your mark &nbsp; 🟡 FREE
  </div>


  <script>

    const tg =
      window.Telegram.WebApp;

    tg.expand();


    const userId =
      tg.initDataUnsafe?.user?.id;


    const chatId =
      tg.initDataUnsafe?.start_param || "";


    let card = [];

    let markedNumbers =
      new Set();


    async function loadCard() {

      if (!chatId || !userId) {

        document.getElementById(
          "status"
        ).innerText =
          "❌ Could not identify the game.";

        return;
      }


      try {

        const response =
          await fetch(
            `/api/card?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(userId)}`
          );


        const data =
          await response.json();


        if (!response.ok) {

          document.getElementById(
            "status"
          ).innerText =
            "❌ " +
            (
              data.error ||
              "Could not load game."
            );

          return;
        }


        card =
          data.card || [];


        const calledNumbers =
          data.calledNumbers || [];


        document.getElementById(
          "playerName"
        ).innerText =
          "👤 " + data.name;


        document.getElementById(
          "status"
        ).innerText =
          data.winner
            ? "🏆 Winner: " + data.winner
            : "🟢 Game is running";


        document.getElementById(
          "counter"
        ).innerText =
          calledNumbers.length +
          "/75 numbers called";


        if (
          calledNumbers.length > 0
        ) {

          const latest =
            calledNumbers[
              calledNumbers.length - 1
            ];


          document.getElementById(
            "latest"
          ).innerText =
            getLetter(latest) +
            "-" +
            latest;

        } else {

          document.getElementById(
            "latest"
          ).innerText =
            "--";

        }


        displayCalledNumbers(
          calledNumbers
        );


        displayCard(
          calledNumbers
        );


      } catch (error) {

        document.getElementById(
          "status"
        ).innerText =
          "❌ Connection error.";

      }

    }


    function displayCard(
      calledNumbers
    ) {

      for (
        let row = 0;
        row < 5;
        row++
      ) {

        for (
          let column = 0;
          column < 5;
          column++
        ) {

          const cell =
            document.getElementById(
              `cell-${row}-${column}`
            );


          const value =
            card[row][column];


          cell.innerText =
            value;


          cell.classList.remove(
            "called",
            "marked",
            "free"
          );


          if (
            value === "FREE"
          ) {

            cell.classList.add(
              "free"
            );

          } else if (
            markedNumbers.has(value)
          ) {

            cell.classList.add(
              "marked"
            );

          } else if (
            calledNumbers.includes(value)
          ) {

            cell.classList.add(
              "called"
            );

          }


          cell.onclick = () => {

            if (
              value === "FREE"
            ) {
              return;
            }


            if (
              calledNumbers.includes(
                value
              )
            ) {

              if (
                markedNumbers.has(value)
              ) {

                markedNumbers.delete(
                  value
                );

              } else {

                markedNumbers.add(
                  value
                );

              }


              displayCard(
                calledNumbers
              );

            }

          };

        }

      }

    }


    function displayCalledNumbers(
      numbers
    ) {

      const container =
        document.getElementById(
          "calledNumbers"
        );


      container.innerHTML = "";


      if (
        numbers.length === 0
      ) {

        container.innerText =
          "No numbers yet";

        return;
      }


      numbers.forEach(
        number => {

          const span =
            document.createElement(
              "span"
            );


          span.className =
            "number";


          span.innerText =
            getLetter(number) +
            "-" +
            number;


          container.appendChild(
            span
          );

        }
      );

    }


    function getLetter(
      number
    ) {

      if (
        number <= 15
      ) return "B";


      if (
        number <= 30
      ) return "I";


      if (
        number <= 45
      ) return "N";


      if (
        number <= 60
      ) return "G";


      return "O";

    }


    async function claimBingo() {

      document.getElementById(
        "message"
      ).innerText =
        "🔍 Checking Bingo...";


      try {

        const response =
          await fetch(
            `/api/bingo?chatId=${encodeURIComponent(chatId)}&userId=${encodeURIComponent(userId)}`
          );


        const data =
          await response.json();


        if (
          response.ok
        ) {

          document.getElementById(
            "message"
          ).innerText =
            "🏆🎉 BINGO! You won!";


          document.getElementById(
            "status"
          ).innerText =
            "🏆 Winner: " +
            data.winner;


          return;
        }


        document.getElementById(
          "message"
        ).innerText =
          "❌ " +
          (
            data.error ||
            "Not Bingo yet!"
          );


      } catch (error) {

        document.getElementById(
          "message"
        ).innerText =
          "❌ Connection error.";

      }

    }


    loadCard();


    setInterval(
      loadCard,
      3000
    );

  </script>

</body>
</html>
