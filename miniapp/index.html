<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    h1 {
      text-align: center;
      margin: 5px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
    }

    #cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 500px;
      margin: auto;
    }

    .card-number {
      border: none;
      border-radius: 10px;
      padding: 14px 5px;
      font-size: 16px;
      font-weight: bold;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    .card-number.selected {
      background: #2196f3;
      color: white;
    }

    #preview {
      display: none;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    #preview h2 {
      text-align: center;
      margin: 5px 0 12px;
    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eeeeee;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .header {
      background: #333;
      color: white;
    }

    .free {
      background: #4caf50;
      color: white;
      font-size: 11px;
    }

    #okButton {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2196f3;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #okButton:disabled {
      background: #aaa;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🎱 Bingo</h1>
  <div class="subtitle">Choose your card</div>

  <div id="message">Loading cards...</div>

  <div id="cards"></div>

  <div id="preview">
    <h2 id="previewTitle">Card</h2>

    <div id="board" class="bingo-board"></div>

    <button id="okButton" disabled>
      OK
    </button>
  </div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const cardsContainer = document.getElementById("cards");
  const preview = document.getElementById("preview");
  const previewTitle = document.getElementById("previewTitle");
  const board = document.getElementById("board");
  const okButton = document.getElementById("okButton");
  const message = document.getElementById("message");

  let cards = [];
  let selectedCard = null;

  /*
   * Telegram Mini App authentication data.
   */
  const initData = tg.initData;

  async function api(url, options = {}) {
    const headers = {
      "Content-Type": "application/json",
      "Authorization": `tma ${initData}`,
      ...(options.headers || {})
    };

    const response = await fetch(url, {
      ...options,
      headers
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    return data;
  }

  /*
   * Load all 100 permanent cards.
   */
  async function loadCards() {
    try {
      message.textContent = "Loading cards...";

      const data = await api("/api/cards");

      cards = data.cards || [];

      cardsContainer.innerHTML = "";

      cards.forEach(card => {
        const button = document.createElement("button");

        button.className = "card-number";
        button.textContent = card.cardNumber;

        button.addEventListener("click", () => {
          selectCard(card.cardNumber);
        });

        cardsContainer.appendChild(button);
      });

      message.textContent = "Choose one card from 1–100.";

      await loadMyCard();

    } catch (error) {
      console.error(error);
      message.textContent = "Error loading cards: " + error.message;
    }
  }

  /*
   * Select a card and show its preview.
   */
  function selectCard(cardNumber) {
    selectedCard = cardNumber;

    document.querySelectorAll(".card-number").forEach(button => {
      button.classList.remove("selected");

      if (Number(button.textContent) === cardNumber) {
        button.classList.add("selected");
      }
    });

    const card = cards.find(
      item => Number(item.cardNumber) === Number(cardNumber)
    );

    if (!card) {
      return;
    }

    showPreview(card);

    okButton.disabled = false;
  }

  /*
   * Display the 5x5 Bingo board.
   */
  function showPreview(card) {
    preview.style.display = "block";

    previewTitle.textContent = `Card #${card.cardNumber}`;

    board.innerHTML = "";

    const headers = ["B", "I", "N", "G", "O"];

    headers.forEach(letter => {
      const cell = document.createElement("div");

      cell.className = "cell header";
      cell.textContent = letter;

      board.appendChild(cell);
    });

    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 5; col++) {

        const cell = document.createElement("div");
        cell.className = "cell";

        if (row === 2 && col === 2) {
          cell.classList.add("free");
          cell.textContent = "FREE";
        } else {
          const value = card.card[row][col];
          cell.textContent = value;
        }

        board.appendChild(cell);
      }
    }

    preview.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }

  /*
   * Confirm selected card.
   */
  okButton.addEventListener("click", async () => {

    if (!selectedCard) {
      return;
    }

    try {
      okButton.disabled = true;
      okButton.textContent = "Saving...";

      const data = await api("/api/select-card", {
        method: "POST",
        body: JSON.stringify({
          initData: initData,
          cardNumber: selectedCard
        })
      });

      message.textContent =
        `✅ Card #${data.cardNumber} selected successfully.`;

      okButton.textContent = "Selected ✓";

      /*
       * Keep the preview visible.
       * Actual Bingo gameplay will be added next.
       */

    } catch (error) {
      console.error(error);

      message.textContent =
        "Error selecting card: " + error.message;

      okButton.disabled = false;
      okButton.textContent = "OK";
    }
  });

  /*
   * Restore player's previously selected card.
   */
  async function loadMyCard() {
    try {

      if (!initData) {
        message.textContent =
          "Please open this page from the Telegram bot.";

        return;
      }

      const data = await api(
        `/api/my-card?initData=${encodeURIComponent(initData)}`
      );

      if (data.cardNumber) {
        selectCard(Number(data.cardNumber));

        message.textContent =
          `Your selected card is #${data.cardNumber}.`;
      }

    } catch (error) {
      console.log("No previous card:", error.message);
    }
  }

  /*
   * Start.
   */
  loadCards();
</script>

</body>
</html>
