<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎱 Bingo</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    h1 {
      margin: 5px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-width: 400px;
      margin: auto;
    }

    .cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header {
      background: #2196f3;
      color: white;
    }

    .free {
      background: #4caf50;
      color: white;
    }

    .marked {
      background: #ff9800;
      color: white;
    }

    button {
      margin-top: 25px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      background: #2196f3;
      color: white;
    }
  </style>
</head>

<body>

  <h1>🎱 Bingo</h1>

  <div class="subtitle">
    Your Bingo Card
  </div>

  <div id="board" class="bingo-board"></div>

  <button onclick="newCard()">🎲 New Card</button>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const ranges = [
      [1, 15],
      [16, 30],
      [31, 45],
      [46, 60],
      [61, 75]
    ];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
      }

      return array;
    }

    function createCard() {
      const card = [];

      for (let row = 0; row < 5; row++) {
        card[row] = [];
      }

      for (let column = 0; column < 5; column++) {

        const numbers = [];

        for (
          let number = ranges[column][0];
          number <= ranges[column][1];
          number++
        ) {
          numbers.push(number);
        }

        shuffle(numbers);

        for (let row = 0; row < 5; row++) {
          card[row][column] = numbers[row];
        }
      }

      card[2][2] = "FREE";

      return card;
    }

    function displayCard(card) {
      const board = document.getElementById("board");

      board.innerHTML = "";

      const letters = ["B", "I", "N", "G", "O"];

      for (let i = 0; i < 5; i++) {

        const cell = document.createElement("div");

        cell.className = "cell header";
        cell.textContent = letters[i];

        board.appendChild(cell);
      }

      for (let row = 0; row < 5; row++) {

        for (let column = 0; column < 5; column++) {

          const cell = document.createElement("div");

          cell.className = "cell";

          cell.textContent = card[row][column];

          if (card[row][column] === "FREE") {
            cell.classList.add("free");
          }

          cell.onclick = function() {

            if (card[row][column] !== "FREE") {
              cell.classList.toggle("marked");
            }

          };

          board.appendChild(cell);
        }
      }
    }

    function newCard() {
      const card = createCard();

      displayCard(card);
    }

    newCard();
  </script>

</body>
</html>
